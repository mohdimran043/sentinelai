name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ai-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-engine/pyproject.toml

      - name: Install
        run: pip install -e '.[dev,runtime]'

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Typecheck
        run: mypy

      - name: Test (CPU only)
        run: pytest -v -m "not gpu and not integration" --cov=sentinel_ai --cov-report=term-missing
