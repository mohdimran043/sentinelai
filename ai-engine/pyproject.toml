[project]
name = "sentinel-ai"
version = "0.1.0"
description = "SentinelAI AI Engine — behaviour intelligence inference orchestrator"
requires-python = "==3.12.*"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # Core, not optional: sentinel_ai.adapters.serialization.event_codec imports
    # it to validate every outbound event against contracts/events/.
    "jsonschema>=4.23",
]

[project.optional-dependencies]
runtime = [
    "fastapi>=0.115",
    # Required by the face-enrolment endpoint, which takes a photograph as multipart
    # form data. FastAPI raises at *route-registration* time without it, not on first
    # request, so a missing pin here takes the whole app down rather than one endpoint.
    "python-multipart>=0.0.9",
    # `POST /authorized-persons/{id}/faces` decodes the uploaded photograph with it.
    # Already present transitively via insightface; pinned because this engine now
    # imports it directly and a transitive dependency is not a promise.
    "pillow>=10.0",
    "uvicorn[standard]>=0.31",
    # The EarthCam resolver (`adapters/sources/earthcam.py`) fetches a public camera
    # page and the playlist it points at, in one session so the page's cookies reach the
    # media requests. Runtime, not dev: a camera configured as a page URL cannot start
    # without it.
    "httpx>=0.27",
    "av>=13.0",
    "numpy>=1.26,<2.2",
    "aio-pika>=9.4",
    "minio>=7.2",
    # sv.ByteTrack is a numpy/scipy association algorithm with no torch
    # dependency, unlike everything else in the gpu extra, so it runs (and is
    # tested) on CPU in CI. Pinned <0.28: sv.ByteTrack is deprecated from
    # 0.28 and raises a FutureWarning at construction time, which is fatal
    # under this suite's -W error.
    "supervision>=0.24,<0.28",
]
gpu = [
    "torch>=2.5",
    "ultralytics>=8.3",
    "transformers>=4.49",
    "accelerate>=1.0",
    "bitsandbytes>=0.43",
    "qwen-vl-utils>=0.0.8",
]
# The face pipeline (spec §8-§12), separate from `gpu` because it is a different
# runtime and a different decision. InsightFace runs under ONNX Runtime rather than
# torch, and person authorization is the one capability that is about people rather
# than compute — a site that never enables it should not be made to install it.
face = [
    "insightface>=0.7",
    "onnxruntime>=1.19",
]
# Swaps the CPU-only ONNX Runtime above for the CUDA build. Measured on an RTX 4090:
# one 1080p frame holding six faces takes 15 ms with this installed and 125 ms without,
# so a site running face cameras at any real frame rate needs it. Separate because it
# is the one dependency here that will not install on a box with no NVIDIA driver.
face-gpu = [
    "insightface>=0.7",
    "onnxruntime-gpu>=1.19",
]
# Reproducing the accuracy numbers, not running the engine. `sentinel_ai/validation/`
# scores the fall machine against URFall and the face pipeline against LFW and FairFace;
# these are the readers for those datasets and nothing else imports them.
validation = [
    "datasets>=2.20",
    "pyarrow>=15.0",
    "pillow>=10.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx>=0.27",
    # starlette>=1.0's TestClient prefers httpx2 over httpx and emits a
    # StarletteDeprecationWarning when only httpx is present; under this
    # suite's `-W error` that warning becomes a collection-time exception, so
    # httpx2 is a real dependency here, not a nicety.
    "httpx2>=2.0",
    # `sentinel_ai.openapi_export` renders the spec §3.2 contract, and
    # `tests/test_openapi_contract.py` fails the build when the committed copy has
    # drifted. Dev-only on purpose: the engine never reads or writes YAML at runtime,
    # so the import is inside the render function rather than at module scope.
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentinel_ai*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
# `tests` is included deliberately: tests/fakes/ are the CI stand-ins for every
# real adapter, so port-signature drift in them is exactly what static checking
# should catch before the real adapters exist.
files = ["sentinel_ai", "tests"]

[[tool.mypy.overrides]]
module = [
    "torch.*",
    # Pillow ships no py.typed marker. It arrived transitively (insightface depends on
    # it) and `qwen25vl.py` has always imported it lazily inside a method; it only
    # became visible to mypy once something installed it into this environment.
    "PIL.*",
    # insightface and onnxruntime are the face pipeline (spec §8-§12) and neither
    # ships types. Same treatment as every other untyped model library here.
    "insightface.*",
    "onnxruntime.*",
    # The validation harness's two dataset readers (`sentinel_ai/validation/`). Neither
    # is a runtime dependency — they are how the accuracy numbers in docs/performance.md
    # are reproduced — and neither ships types.
    "datasets.*",
    "pyarrow.*",
    "supervision.*",
    "av.*",
    "bitsandbytes.*",
    "qwen_vl_utils.*",
    "minio.*",
    "jsonschema.*",
    "yaml.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `ultralytics.*` gets its own override, separate from the plain
# ignore_missing_imports block above: unlike the others, this package *is*
# installed in this dev environment (the gpu extra), so mypy actually reads
# its source instead of treating it as missing. Its top-level `__init__.py`
# does not explicitly re-export `YOLO` the way `no_implicit_reexport` (part of
# `strict`) requires, and `model.predict(...)`'s real return type is a wide,
# awkward union. `follow_imports = "skip"` makes both the installed-here and
# not-installed-in-CI cases behave identically: the module is `Any` either way.
module = ["ultralytics.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# `transformers.*` gets the same `follow_imports = "skip"` treatment as
# `ultralytics.*` above, for the same reason: it *is* installed here (the
# `gpu` extra), so mypy reads its real source rather than treating it as
# missing, and `strict`'s `disallow_untyped_calls` then flags
# `from_pretrained`, `BitsAndBytesConfig`, etc. as untyped calls (transformers
# ships only partial inline types). Skipping makes the installed-here and
# not-installed-in-CI cases behave identically: `Any` either way.
module = ["transformers.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "gpu: requires a CUDA GPU and downloaded model weights (deselect with -m 'not gpu')",
    "integration: requires docker-compose core services running",
    "network: reaches a third-party public site (deselect with -m 'not network')",
]
filterwarnings = [
    "error",
    # Narrow, third-party-only exemption. starlette 1.6's `testclient` module
    # imports `anyio.abc.BlockingPortal` at module scope, and anyio 4.15
    # deprecated that alias. It fires at *collection* time, inside a dependency
    # we do not call directly, so no amount of care in this tree can avoid it and
    # `error` turns it into an uncollectable test module. Matched by message and
    # by its exact message, not by category alone, so it cannot mask any other
    # DeprecationWarning this suite is meant to fail on. (No module qualifier:
    # the warning's stacklevel attributes it to whichever module touched the
    # alias, which is starlette here and could be another dependency tomorrow —
    # pinning the module would make the ignore silently stop applying.)
    "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated:DeprecationWarning",
]
# Here rather than as a `-W error` flag on the command line, because a flag is only
# enforced by whoever remembers to type it. This is the policy that justifies the
# `httpx2` dependency and the `supervision>=0.24,<0.28` pin, both of which exist
# solely because a warning under it is fatal; CI ran without the flag, so either pin
# could have been silently undone by a passing build. The only exemption in the tree
# is a per-test `filterwarnings` mark on the three GPU tests that load Qwen through
# bitsandbytes — see `tests/gpu_warnings.py` for exactly what it covers and why.
