[project]
name = "sentinel-ai"
version = "0.1.0"
description = "SentinelAI AI Engine — behaviour intelligence inference orchestrator"
requires-python = "==3.12.*"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # Core, not optional: sentinel_ai.adapters.serialization.event_codec imports
    # it to validate every outbound event against contracts/events/.
    "jsonschema>=4.23",
]

[project.optional-dependencies]
runtime = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.31",
    "av>=13.0",
    "numpy>=1.26,<2.2",
    "aio-pika>=9.4",
    "minio>=7.2",
]
gpu = [
    "torch>=2.5",
    "ultralytics>=8.3",
    "supervision>=0.24",
    "transformers>=4.49",
    "accelerate>=1.0",
    "autoawq>=0.2.6",
    "qwen-vl-utils>=0.0.8",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentinel_ai*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
files = ["sentinel_ai"]

[[tool.mypy.overrides]]
module = [
    "ultralytics.*",
    "supervision.*",
    "av.*",
    "autoawq.*",
    "qwen_vl_utils.*",
    "minio.*",
    "jsonschema.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "gpu: requires a CUDA GPU and downloaded model weights (deselect with -m 'not gpu')",
    "integration: requires docker-compose core services running",
]
