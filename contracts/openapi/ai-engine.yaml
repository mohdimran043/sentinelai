info:
  title: SentinelAI AI Engine
  version: 0.1.0
openapi: 3.1.0
paths:
  /cameras:
    get:
      operationId: list_cameras_cameras_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CamerasResponse'
          description: Successful Response
      summary: List Cameras
  /cameras/{camera_id}/describe:
    post:
      operationId: describe_camera_now_cameras__camera_id__describe_post
      parameters:
      - in: path
        name: camera_id
        required: true
        schema:
          title: Camera Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescribeResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Describe Camera Now
  /cameras/{camera_id}/events:
    get:
      description: "Recent anomaly events for one camera, plus the latest scene description.\n\n**This\
        \ is a volatile, bounded, in-memory view for the operator console. It is not\nthe event store\
        \ and it is not an audit trail.** The durable record is the anomaly\nevent published to RabbitMQ\
        \ and written down by the Phase 1C consumer. What this\nendpoint reads is a per-camera ring inside\
        \ the running engine that is emptied by\nany restart and that silently discards the oldest entry\
        \ once the camera has\nproduced more than `capacity` events. The absence of an event here means\
        \ \"not in\nthe last `capacity` events of this process run\" \u2014 never \"did not happen\".\
        \ Anyone\nreconciling a custodial incident must go to the store, not here.\n\nThe ring is per\
        \ camera rather than global on purpose, so that a busy camera can\nonly evict its own history\
        \ and never a quiet camera's.\n\n`latest` is the last element of `events`, lifted out for the\
        \ live scene panel and\nread from the same snapshot, so the panel and the chart cannot disagree\
        \ about\nwhich event is newest. `latest_description_state` distinguishes the three cases a\nconsole\
        \ must not confuse: `none` (nothing assembled yet in this process),\n`available` (a real vision-model\
        \ description), and `unavailable` (the vision model\ncould not answer, and `latest.description`\
        \ is a metadata-derived stand-in rather\nthan a description of the scene).\n\nAn unknown camera\
        \ is a 404, the same mapping every other camera route uses. A\nconfigured camera that has not\
        \ escalated yet is a 200 with an empty `events` list."
      operationId: get_camera_events_cameras__camera_id__events_get
      parameters:
      - in: path
        name: camera_id
        required: true
        schema:
          title: Camera Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraEventsResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: "Recent events for one camera (volatile console cache \u2014 NOT the event store)"
  /cameras/{camera_id}/telemetry:
    get:
      operationId: get_camera_telemetry_cameras__camera_id__telemetry_get
      parameters:
      - in: path
        name: camera_id
        required: true
        schema:
          title: Camera Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraStatus'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Camera Telemetry
  /health:
    get:
      operationId: get_health_health_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: Successful Response
      summary: Get Health
