components:
  schemas:
    CameraEventsResponse:
      description: 'A **volatile, bounded, in-memory view for the operator console. Not the event

        store, and not an audit trail.**


        The durable record of what happened is RabbitMQ plus the Phase 1C consumer that

        writes it down. This endpoint reads an in-process ring that (a) is emptied by any

        restart of the engine, and (b) silently discards a camera''s oldest entry once that

        camera has produced more than `capacity` events. An absent event here therefore

        means "not in the last `capacity` events of this process run" and never "did not

        happen". Do not reconcile against it, do not report from it, and do not use it to

        establish that nothing occurred.'
      properties:
        camera_id:
          title: Camera Id
          type: string
        capacity:
          description: "The per-camera ring bound. Once `returned` reaches it, every new event silently\
            \ evicts the oldest \u2014 published here so a console can say how much history it is not\
            \ showing."
          title: Capacity
          type: integer
        events:
          description: "Retained events, oldest first \u2014 plot them in this order."
          items:
            $ref: '#/components/schemas/RecentEventEntry'
          title: Events
          type: array
        latest:
          anyOf:
          - $ref: '#/components/schemas/RecentEventEntry'
          - type: 'null'
          description: The most recent event, i.e. the last element of `events`, lifted out for the live
            scene panel. Read from the same snapshot as `events`, so the panel and the chart can never
            disagree about which event is newest. Null exactly when `latest_description_state` is 'none'.
        latest_description_state:
          description: Whether the live panel has a real description ('available'), a stand-in because
            the vision model could not answer ('unavailable'), or nothing at all yet ('none').
          enum:
          - none
          - available
          - unavailable
          title: Latest Description State
          type: string
        returned:
          description: How many events this response carries.
          title: Returned
          type: integer
        volatile:
          const: true
          default: true
          description: 'Always true, and present so it cannot be overlooked: this history is held in engine
            memory only and does not survive a restart. The event store is elsewhere.'
          title: Volatile
          type: boolean
      required:
      - camera_id
      - capacity
      - returned
      - latest_description_state
      - latest
      - events
      title: CameraEventsResponse
      type: object
    CameraStatus:
      properties:
        camera_id:
          title: Camera Id
          type: string
        detections_run:
          title: Detections Run
          type: integer
        discontinuities:
          title: Discontinuities
          type: integer
        escalations:
          title: Escalations
          type: integer
        escalations_dropped:
          title: Escalations Dropped
          type: integer
        frames_dropped:
          title: Frames Dropped
          type: integer
        frames_seen:
          title: Frames Seen
          type: integer
        last_escalation_at:
          anyOf:
          - type: number
          - type: 'null'
          title: Last Escalation At
        last_frame_at:
          anyOf:
          - type: number
          - type: 'null'
          title: Last Frame At
        zone:
          anyOf:
          - $ref: '#/components/schemas/Zone'
          - type: 'null'
          description: "Which space this camera watches \u2014 the field cameras are grouped by. Null\
            \ means ungrouped: nobody has assigned this camera a zone. Null is not a group; do not render\
            \ it as one alongside the real zones."
        zone_kind:
          anyOf:
          - $ref: '#/components/schemas/ZoneKind'
          - type: 'null'
          description: The coarse grouping `zone` falls into, derived from it and never stored separately,
            so the two cannot disagree. Null exactly when `zone` is null.
      required:
      - camera_id
      - frames_seen
      - frames_dropped
      - detections_run
      - escalations
      - escalations_dropped
      - discontinuities
      - last_frame_at
      - last_escalation_at
      title: CameraStatus
      type: object
    CamerasResponse:
      properties:
        cameras:
          items:
            $ref: '#/components/schemas/CameraStatus'
          title: Cameras
