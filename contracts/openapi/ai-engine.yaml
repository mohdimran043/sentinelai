  /events/stream:
    get:
      description: "Every camera's anomaly events, pushed as they happen (spec \xA76.2, bridged).\n\n\
        **The same volatile, bounded, in-memory ring `GET /cameras/{camera_id}/events`\nserves \u2014\
        \ not the event store and not an audit trail.** The durable record is the\nanomaly event published\
        \ to RabbitMQ and written down by the Phase 1C consumer.\nEverything this stream can send is held\
        \ in engine memory, is lost on restart, and\nis silently evicted once a camera has produced more\
        \ than `capacity` events.\n\n**What a reconnect can and cannot give you.** Every connection opens\
        \ with a\n`backlog` frame holding what the ring currently has, then continues live. There is\n\
        no gap between the two and no duplicate across them. But the ring is bounded, so a\nclient that\
        \ was disconnected long enough for a camera to produce more than its\nring holds **has permanently\
        \ missed those events on this endpoint** \u2014 they are in\nRabbitMQ, and this endpoint will\
        \ never show them. That is why no `id:` field is\nsent and `Last-Event-ID` is not honoured: resuming\
        \ from an offset the engine may\nno longer hold would promise a continuity it cannot keep. Reconnect,\
        \ take the new\nbacklog as the current window, and go to the store for anything older.\n\n**Duplicates\
        \ and updates.** An `event_id` may arrive more than once: an event is\nre-sent when something\
        \ about it changes, currently when its clip finishes and\n`clip_uri` appears. Merge by `event_id`,\
        \ keeping the copy with the higher\n`sequence`. Two copies with the same `sequence` are the same\
        \ copy.\n\n**Falling behind.** A client that stops reading is buffered up to a fixed bound\nand\
        \ then cut off with an `overflow` frame rather than being allowed to grow the\nengine's memory.\
        \ Reconnect; the fresh backlog is more current than the queue that\nwas dropped.\n\n**Shutdown.**\
        \ The engine closes every stream as it shuts down, so a client sees a\nclean end of response rather\
        \ than a connection that hangs until a proxy times it\nout."
      operationId: stream_events_events_stream_get
      responses:
        '200':
          content:
            text/event-stream:
              schema:
                type: string
          description: "An open `text/event-stream`. Frames: `event: backlog` once, carrying a JSON array\
            \ of RecentEventEntry (oldest first, possibly empty); then `event: anomaly`, one RecentEventEntry\
            \ each, as they are assembled; `event: overflow` if this client fell too far behind, after\
            \ which the stream ends and reconnecting is the recovery; and `: keepalive` comment lines\
            \ on an idle stream. No `id:` field is sent and `Last-Event-ID` is not honoured \u2014 see\
            \ the description."
        '503':
          description: The engine has not finished starting; retry shortly.
      summary: "Live event stream (SSE) over the same volatile ring \u2014 NOT the event store"
