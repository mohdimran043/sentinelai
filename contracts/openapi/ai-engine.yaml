# Generated by `python -m sentinel_ai.openapi_export` — do not edit by hand.
# Spec §3.2: the committed document must not drift from the running app;
# `tests/test_openapi_contract.py` fails the build when it does.
components:
  schemas:
    CameraEditRequest:
      additionalProperties: false
      description: "A partial edit to one camera's record: its label, its zone, and its welfare\nnotification\
        \ policy, in any combination.\n\nPartial on purpose \u2014 a console changing a label must not\
        \ have to restate a zone\nit is not touching, because restating it is how one operator's window\
        \ silently\nreverts another's change.\n\n**Only the runtime-editable fields are accepted, and\
        \ the rest are rejected\nrather than ignored.** `extra=\"forbid\"` means a body carrying `url`\
        \ or\n`profile` is a 422 naming the field, not a 200 that quietly dropped it. That\nis the whole\
        \ reason the model is strict: the failure this endpoint must never\nhave is an operator re-pointing\
        \ a camera at a new stream, being told it\nworked, and watching the old stream for a week."
      properties:
        clip_postroll_seconds:
          anyOf:
          - exclusiveMinimum: 0.0
            type: number
          - type: 'null'
          description: "Seconds of video to keep recording after a notified concern's keyframe, for this\
            \ camera only. `null` reverts it to the engine-wide default; omitting the field leaves it\
            \ as configured. Must be greater than zero \u2014 a clip that ends where it begins is not\
            \ a shorter clip, it is no clip."
          title: Clip Postroll Seconds
        clip_preroll_seconds:
          anyOf:
          - minimum: 0.0
            type: number
          - type: 'null'
          description: "Seconds of buffered video to keep before a notified concern's keyframe, for this\
            \ camera only. `null` reverts it to the engine-wide default; omitting the field leaves it\
            \ as configured \u2014 **the two are different instructions**, the same way `zone`'s are.\
            \ `0` is allowed and means no lead-in at all, which is why this bound is `>= 0` where the\
            \ other two durations are `> 0`."
          title: Clip Preroll Seconds
        label:
          anyOf:
          - maxLength: 120
            minLength: 1
            type: string
          - type: 'null'
          description: "The camera's new display name. Trimmed; must be non-empty after trimming. Omit\
            \ the field to leave the label alone \u2014 `null` is not a label and is rejected."
          title: Label
        notify_min_confidence:
          anyOf:
          - $ref: '#/components/schemas/Confidence'
          - type: 'null'
          description: "The lowest confidence tier that may notify. `likely` is the engine's default;\
            \ `possible` widens it to everything the model flags at all, which on an ordinary day is most\
            \ of its opinions. Omit to leave the threshold alone; `null` is rejected, because a camera\
            \ has no 'no threshold' state. There are exactly two tiers and there is no `certain` \u2014\
            \ see `domain/welfare.py`: one still frame cannot earn it."
        notify_on:
          anyOf:
          - items:
              $ref: '#/components/schemas/ConcernKind'
            type: array
          - type: 'null'
          description: "Which welfare concern kinds this camera notifies a human about, replacing whatever\
            \ is configured now \u2014 this is a whole new list, not an addition to the old one. **`[]`\
            \ means never notify from this camera**, which is a real instruction and not an empty edit:\
            \ it silences one camera without turning welfare monitoring off anywhere else. Omit the field\
            \ to leave the routing alone; `null` is rejected, because `[]` already covers the only thing\
            \ it could have meant. A kind outside the enum is a 422 rather than a silent narrowing of\
            \ the list \u2014 a typo'd kind is a concern the operator meant to be told about and would\
            \ not be."
          title: Notify On
        summary_interval_seconds:
          anyOf:
          - exclusiveMinimum: 0.0
            type: number
          - type: 'null'
          description: "How often this camera's periodic summary runs. `null` reverts it to the camera\
            \ profile's interval; omitting the field leaves it as configured. Distinct from `profile.summary_interval_seconds`,\
            \ which is restart-only \u2014 this is the runtime-editable override of it, and it wins where\
            \ both are set."
          title: Summary Interval Seconds
        zone:
          anyOf:
          - $ref: '#/components/schemas/Zone'
          - type: 'null'
          description: "The camera's new zone, or `null` to ungroup it. Unlike `label`, `null` here is\
            \ a real instruction, so **omitting the field and sending null mean different things**: omit\
            \ to leave the grouping alone, send null to remove it. A value outside the enum is a 422 \u2014\
            \ the same fail-loud `load_cameras` applies at startup, because a typo'd zone is a camera\
            \ the operator meant to group and silently did not."
      title: CameraEditRequest
      type: object
    CameraEditResponse:
      description: 'The camera''s record as `cameras.json` now holds it, after a successful edit.


        The whole record rather than an acknowledgement: a console that has just

        written should render what was stored, not what it hoped was stored.'
      properties:
        camera_id:
          title: Camera Id
          type: string
        clip_postroll_seconds:
          anyOf:
          - type: number
          - type: 'null'
          description: 'As `clip_preroll_seconds`: the stored override, or null for the default.'
          title: Clip Postroll Seconds
        clip_preroll_seconds:
          anyOf:
          - type: number
          - type: 'null'
          description: "The stored per-camera override, or null when this camera uses the engine-wide\
            \ default. Null here is the answer to 'what is stored', not a report of the effective value\
            \ \u2014 the default in force is not this endpoint's to state."
          title: Clip Preroll Seconds
        label:
          title: Label
          type: string
        notify_min_confidence:
          $ref: '#/components/schemas/Confidence'
          description: 'The stored confidence threshold. Never null: a camera always has one.'
        notify_on:
          description: "The concern kinds this camera will notify on, as stored \u2014 always the full\
            \ list, never a diff, and sorted so two reads of the same record compare equal. A camera whose\
            \ file says nothing about `notify_on` lists every kind here, because that is what saying nothing\
            \ means. `[]` means this camera notifies nobody."
          items:
            $ref: '#/components/schemas/ConcernKind'
          title: Notify On
          type: array
        persisted:
          const: true
          default: true
          description: 'Always true, and present so it cannot be overlooked: this edit was written to
            the engine''s `cameras.json` before this response was sent, and survives a restart. An edit
            that could not be written is an error response, never a 200 with this set to false.'
          title: Persisted
          type: boolean
        restart_required_fields:
          description: "Fields of the camera record that this endpoint will not change at all: they are\
            \ stored in `cameras.json`, honoured at startup, and require editing that file and restarting\
            \ the engine. `url` because changing it means tearing down the running camera and building\
            \ a new source (and because an RTSP URL routinely carries credentials, which an unauthenticated\
            \ API must not move in either direction); `profile` because it is the escalation policy the\
            \ gate is part-way through applying. Sending either one is a 422, not a silent drop \u2014\
            \ a console should show them as read-only and say why, not offer a control that does nothing."
          items:
            type: string
          title: Restart Required Fields
          type: array
        summary_interval_seconds:
          anyOf:
          - type: number
          - type: 'null'
          description: The stored override, or null when this camera falls back to its profile's `summary_interval_seconds`.
          title: Summary Interval Seconds
        zone:
          anyOf:
          - $ref: '#/components/schemas/Zone'
          - type: 'null'
          description: The stored zone, or null when the camera is ungrouped.
        zone_kind:
          anyOf:
          - $ref: '#/components/schemas/ZoneKind'
          - type: 'null'
          description: Derived from `zone`, exactly as on `CameraStatus`. Null when `zone` is.
      required:
      - camera_id
      - label
      - zone
      - zone_kind
      - notify_on
      - notify_min_confidence
      - clip_preroll_seconds
      - clip_postroll_seconds
      - summary_interval_seconds
      title: CameraEditResponse
      type: object
    CameraEventsResponse:
      description: 'A **volatile, bounded, in-memory view for the operator console. Not the event

        store, and not an audit trail.**


        The durable record of what happened is RabbitMQ plus the Phase 1C consumer that

        writes it down. This endpoint reads an in-process ring that (a) is emptied by any

        restart of the engine, and (b) silently discards a camera''s oldest entry once that

        camera has produced more than `capacity` events. An absent event here therefore

        means "not in the last `capacity` events of this process run" and never "did not

        happen". Do not reconcile against it, do not report from it, and do not use it to

        establish that nothing occurred.'
      properties:
        camera_id:
          title: Camera Id
          type: string
        capacity:
          description: "The per-camera ring bound. Once `returned` reaches it, every new event silently\
            \ evicts the oldest \u2014 published here so a console can say how much history it is not\
            \ showing."
          title: Capacity
          type: integer
        events:
          description: "Retained events, oldest first \u2014 plot them in this order."
          items:
            $ref: '#/components/schemas/RecentEventEntry'
          title: Events
          type: array
        latest:
          anyOf:
          - $ref: '#/components/schemas/RecentEventEntry'
          - type: 'null'
          description: The most recent event, i.e. the last element of `events`, lifted out for the live
            scene panel. Read from the same snapshot as `events`, so the panel and the chart can never
            disagree about which event is newest. Null exactly when `latest_description_state` is 'none'.
        latest_description_state:
          description: Whether the live panel has a real description ('available'), a stand-in because
            the vision model could not answer ('unavailable'), or nothing at all yet ('none').
          enum:
          - none
          - available
          - unavailable
          title: Latest Description State
          type: string
        returned:
          description: How many events this response carries.
          title: Returned
          type: integer
        volatile:
          const: true
          default: true
          description: 'Always true, and present so it cannot be overlooked: this history is held in engine
            memory only and does not survive a restart. The event store is elsewhere.'
          title: Volatile
          type: boolean
      required:
      - camera_id
      - capacity
      - returned
      - latest_description_state
      - latest
      - events
      title: CameraEventsResponse
      type: object
    CameraStatus:
      properties:
        camera_id:
          title: Camera Id
          type: string
        detections_run:
          title: Detections Run
          type: integer
        discontinuities:
          title: Discontinuities
          type: integer
        escalations:
          title: Escalations
          type: integer
        escalations_dropped:
          title: Escalations Dropped
          type: integer
        frames_dropped:
          title: Frames Dropped
          type: integer
        frames_seen:
          title: Frames Seen
          type: integer
        label:
          description: "The camera's display name, from `cameras.json`; defaults to `camera_id` when the\
            \ file gives none. Editable at runtime via `PATCH /cameras/{camera_id}` \u2014 read it back\
            \ from here after a write to see what the engine is actually using."
          title: Label
          type: string
        last_escalation_at:
          anyOf:
          - type: number
          - type: 'null'
          title: Last Escalation At
        last_frame_at:
          anyOf:
          - type: number
          - type: 'null'
          title: Last Frame At
        zone:
          anyOf:
          - $ref: '#/components/schemas/Zone'
          - type: 'null'
          description: "Which space this camera watches \u2014 the field cameras are grouped by. Null\
            \ means ungrouped: nobody has assigned this camera a zone. Null is not a group; do not render\
            \ it as one alongside the real zones."
        zone_kind:
          anyOf:
          - $ref: '#/components/schemas/ZoneKind'
          - type: 'null'
          description: The coarse grouping `zone` falls into, derived from it and never stored separately,
            so the two cannot disagree. Null exactly when `zone` is null.
      required:
      - camera_id
      - label
      - frames_seen
      - frames_dropped
      - detections_run
      - escalations
      - escalations_dropped
      - discontinuities
      - last_frame_at
      - last_escalation_at
      title: CameraStatus
      type: object
    CamerasResponse:
      properties:
        cameras:
          items:
            $ref: '#/components/schemas/CameraStatus'
          title: Cameras
          type: array
        config_writable:
          description: "Whether `PATCH /cameras/{camera_id}` will do anything on this deployment. False\
            \ \u2014 the default \u2014 means the write endpoint answers 403 and the camera record can\
            \ only be changed by editing `cameras.json` and restarting. This engine has **no authentication**,\
            \ so writes are opt-in per deployment (`SENTINEL_ENABLE_CAMERA_WRITES`); see the PATCH operation's\
            \ description. Published here so a console can render the record read-only rather than offering\
            \ controls that will 403."
          title: Config Writable
          type: boolean
      required:
      - cameras
      - config_writable
      title: CamerasResponse
      type: object
    ConcernKind:
      description: What the VLM's welfare-focused prompt asks the frame to be checked for.
      enum:
      - collapse
      - altercation
      - self_harm
      - medication
      - distress
      - other
      title: ConcernKind
      type: string
    Confidence:
      description: 'How sure a single still frame can honestly make the model.


        Deliberately two members, not three: see the module docstring for why

        there is no `CERTAIN`.'
      enum:
      - possible
      - likely
      title: Confidence
      type: string
    DescribeResponse:
      properties:
        event_id:
          format: uuid
          title: Event Id
          type: string
      required:
      - event_id
      title: DescribeResponse
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    HealthResponse:
      properties:
        models:
          items:
            $ref: '#/components/schemas/ModelHealth'
          title: Models
          type: array
        status:
          title: Status
          type: string
      required:
      - status
      - models
      title: HealthResponse
      type: object
    ModelHealth:
      properties:
        detail:
          title: Detail
          type: string
        key:
          title: Key
          type: string
        state:
          title: State
          type: string
        vram_mib:
          title: Vram Mib
          type: integer
      required:
      - key
      - state
      - detail
      - vram_mib
      title: ModelHealth
      type: object
    RecentEventEntry:
      description: "One event as the console sees it \u2014 a projection of the published anomaly event,\n\
        not the event itself.\n\nThe same shape is served three ways: in `GET /cameras/{camera_id}/events`,\
        \ in the\n`backlog` array that opens `GET /events/stream`, and in each live frame on that\nstream.\
        \ One shape on purpose, so a console can merge all three into one list\nkeyed by `event_id`, keeping\
        \ the copy with the highest `sequence`."
      properties:
        camera_id:
          description: Which camera produced this. Redundant on the per-camera endpoint, and essential
            on `/events/stream`, which carries every camera's events.
          title: Camera Id
          type: string
        clip_uri:
          anyOf:
          - type: string
          - type: 'null'
          description: "Where this event's clip was written, or null. Null covers three different situations\
            \ and is not by itself evidence of any one of them: no clip was being recorded, the clip has\
            \ not finished uploading yet (it lands shortly after the event, and the event is then re-sent\
            \ on the stream with a higher `sequence`), or the clip failed to write. An event is never\
            \ withheld because its clip failed \u2014 spec \xA79 \u2014 so a null here says nothing at\
            \ all about whether the event happened."
          title: Clip Uri
        description:
          description: "The scene description \u2014 unless `description_unavailable` is true, in which\
            \ case this is a metadata-derived stand-in and not a description of the scene."
          title: Description
          type: string
        description_unavailable:
          description: True when the vision model could not answer and this event was assembled from cheap
            signals alone. Never conflate it with the absence of an event.
          title: Description Unavailable
          type: boolean
        event_id:
          format: uuid
          title: Event Id
          type: string
        labels:
          items:
            type: string
          title: Labels
          type: array
        occurred_at:
          description: "Unix epoch seconds (UTC, fractional). Sort and plot on this \u2014 it is the same\
            \ field, with the same meaning, as the published event's `occurred_at`."
          title: Occurred At
          type: number
        reason:
          description: Which of the seven escalation triggers fired.
          title: Reason
          type: string
        sequence:
          description: "This version's position in the engine's write order for the recent-event ring\
            \ \u2014 a de-duplication key, never a sort key. An event can be sent more than once with\
            \ the same `event_id`: it is re-sent when something about it changes, currently when its clip\
            \ finishes uploading and `clip_uri` appears. The copy with the higher `sequence` is the newer\
            \ one; two copies with the same `sequence` are the same copy. Per process and monotonic \u2014\
            \ it restarts from zero when the engine does, exactly like the ring itself, so never persist\
            \ it or compare it across a restart."
          title: Sequence
          type: integer
        severity:
          description: The band `threat_score` falls in.
          title: Severity
          type: string
        source_timestamp:
          anyOf:
          - type: number
          - type: 'null'
          description: The camera source's own timeline for the same instant. Correlates with a clip's
            pts; meaningful only within one process run for one camera, so never sort or display on it.
          title: Source Timestamp
        suggested_action:
          title: Suggested Action
          type: string
        threat_score:
          description: The threat value, 0.0 to 1.0.
          maximum: 1.0
          minimum: 0.0
          title: Threat Score
          type: number
        track_ids:
          items:
            type: integer
          title: Track Ids
          type: array
      required:
      - event_id
      - camera_id
      - sequence
      - clip_uri
      - occurred_at
      - source_timestamp
      - reason
      - threat_score
      - severity
      - description
      - suggested_action
      - description_unavailable
      - labels
      - track_ids
      title: RecentEventEntry
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    Zone:
      description: 'The space a camera watches. The recorder''s `space_type` vocabulary, exactly.


        Deliberately the recorder''s four-camera vocabulary rather than a new one: the two

        systems watch the same building, and a console that shows both must not have to

        translate. Extending it is a one-line addition here plus its entry in `_KINDS`,

        which `tests/domain/test_zone.py` requires for every member.'
      enum:
      - room
      - corridor
      - dayroom
      title: Zone
      type: string
    ZoneKind:
      description: 'The coarse privacy/behaviour split a `Zone` falls into.


        Derived from `Zone`, never stored: see this module''s docstring. `StrEnum` so it

        serialises as `"room"` / `"common_area"` with no encoder of its own.'
      enum:
      - room
      - common_area
      title: ZoneKind
      type: string
info:
  title: SentinelAI AI Engine
  version: 0.1.0
openapi: 3.1.0
paths:
  /cameras:
    get:
      operationId: list_cameras_cameras_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CamerasResponse'
          description: Successful Response
      summary: List Cameras
  /cameras/{camera_id}:
    patch:
      description: "Change what a camera is called, which zone it is grouped into, and what its\nwelfare\
        \ concerns notify a human about.\n\n### This endpoint is not authenticated\n\n**Phase 1B ships\
        \ no authentication of any kind.** The console's login screen\nis a shell, JWT arrives in Phase\
        \ 1C, and until then anything that can open a\nTCP connection to this port can call this. Every\
        \ other endpoint is a read, so\nreaching the port has so far cost an attacker information; this\
        \ one is a\nwrite, and a persisted one. An anonymous caller can rename a camera to another\ncamera's\
        \ name and re-zone it into another wing \u2014 which is to say, make the\nconsole's account of\
        \ *where an incident happened* wrong, in a custodial\nsetting, permanently, because the change\
        \ is written to `cameras.json` and\nsurvives the restart that would otherwise undo it.\n\nThat\
        \ is why it is **off unless a deployment turns it on**\n(`SENTINEL_ENABLE_CAMERA_WRITES=true`)\
        \ and answers 403 otherwise, and why a\ndeployment that turns it on should also bind the engine\
        \ to localhost or put an\nauthenticating reverse proxy in front of it. `GET /cameras` reports\
        \ the current\nposture as `config_writable`. See `docs/operations.md`.\n\n### What can be edited,\
        \ and what cannot\n\nEditable at runtime, applied to the running camera and written to\n`cameras.json`\
        \ before this returns:\n\n* `label` \u2014 the display name. Trimmed, non-empty, at most 120 characters.\n\
        * `zone` \u2014 `room`, `corridor`, `dayroom`, or `null` to ungroup. Omitting the\n  field and\
        \ sending `null` are different instructions.\n* `notify_on` \u2014 which welfare concern kinds\
        \ notify a human, as a whole\n  replacement list. `[]` means never notify from this camera and\
        \ is a real\n  edit, not an empty one; `null` is rejected because `[]` already says it.\n* `notify_min_confidence`\
        \ \u2014 `possible` or `likely`, the lowest tier that may\n  notify. There is no `certain`: one\
        \ still frame cannot earn it.\n* `clip_preroll_seconds`, `clip_postroll_seconds`,\n  `summary_interval_seconds`\
        \ \u2014 per-camera overrides of the engine-wide clip\n  bounds and the profile's summary interval.\
        \ **Omitting one and sending\n  `null` are different instructions**, as with `zone`: omit to leave\
        \ the\n  override alone, send `null` to drop it and go back to the default. Pre-roll\n  may be\
        \ `0` (no lead-in is a real choice); the other two must be above zero.\n\nEvery one of them comes\
        \ back in the response as it was stored, so a console\nrenders what the file now says rather than\
        \ what it hoped it would say.\n\n**Not editable, and rejected with 422 rather than ignored** \u2014\
        \ the response's\n`restart_required_fields` names them:\n\n* `url` \u2014 changing the source\
        \ means tearing down the running `CameraRunner`,\n  its buffered pre-roll and any clip mid-recording,\
        \ and building a new source\n  in their place. It is a camera restart, not an edit. Separately,\
        \ an RTSP URL\n  routinely carries credentials, so an unauthenticated API neither accepts nor\n\
        \  returns it.\n* `profile` \u2014 the escalation policy, which the gate is part-way through\n\
        \  applying (cooldowns, a token bucket with state). Swapping it mid-flight has\n  no defensible\
        \ semantics.\n\nBoth are edited by changing `cameras.json` and restarting the engine.\n\n### Atomicity\n\
        \nThe edit is validated against the whole document, written to a temporary file,\n`fsync`ed, and\
        \ renamed into place. It is never half-applied: a request that\nwould produce a file the engine\
        \ could not load at its next startup is refused\noutright, and everything the file holds that\
        \ this engine has no model of \u2014\ncomment keys, other cameras, fields added later \u2014 is\
        \ preserved byte-for-byte\nin meaning. The in-memory camera is only updated *after* the file is\
        \ on disk,\nand from what the file now says, so the two cannot disagree."
      operationId: update_camera_cameras__camera_id__patch
      parameters:
      - in: path
        name: camera_id
        required: true
        schema:
          title: Camera Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CameraEditRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraEditResponse'
          description: Successful Response
        '403':
          description: Camera writes are disabled on this deployment, which is the default. Set `SENTINEL_ENABLE_CAMERA_WRITES=true`
            on the engine to enable them, having read the warning in this operation's description first.
        '404':
          description: No camera with this id is configured in the running engine.
        '409':
          description: "`cameras.json` cannot be edited as it currently stands \u2014 most often because\
            \ the file has been changed by hand since the engine started and no longer contains this camera.\
            \ Nothing was written."
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '500':
          description: The camera file could not be written. Nothing was changed.
      summary: "Edit a camera's label, zone and welfare notification policy \u2014 UNAUTHENTICATED, and\
        \ off by default"
  /cameras/{camera_id}/describe:
    post:
      operationId: describe_camera_now_cameras__camera_id__describe_post
      parameters:
      - in: path
        name: camera_id
        required: true
        schema:
          title: Camera Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescribeResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Describe Camera Now
  /cameras/{camera_id}/events:
    get:
      description: "Recent anomaly events for one camera, plus the latest scene description.\n\n**This\
        \ is a volatile, bounded, in-memory view for the operator console. It is not\nthe event store\
        \ and it is not an audit trail.** The durable record is the anomaly\nevent published to RabbitMQ\
        \ and written down by the Phase 1C consumer. What this\nendpoint reads is a per-camera ring inside\
        \ the running engine that is emptied by\nany restart and that silently discards the oldest entry\
        \ once the camera has\nproduced more than `capacity` events. The absence of an event here means\
        \ \"not in\nthe last `capacity` events of this process run\" \u2014 never \"did not happen\".\
        \ Anyone\nreconciling a custodial incident must go to the store, not here.\n\nThe ring is per\
        \ camera rather than global on purpose, so that a busy camera can\nonly evict its own history\
        \ and never a quiet camera's.\n\n`latest` is the last element of `events`, lifted out for the\
        \ live scene panel and\nread from the same snapshot, so the panel and the chart cannot disagree\
        \ about\nwhich event is newest. `latest_description_state` distinguishes the three cases a\nconsole\
        \ must not confuse: `none` (nothing assembled yet in this process),\n`available` (a real vision-model\
        \ description), and `unavailable` (the vision model\ncould not answer, and `latest.description`\
        \ is a metadata-derived stand-in rather\nthan a description of the scene).\n\nAn unknown camera\
        \ is a 404, the same mapping every other camera route uses. A\nconfigured camera that has not\
        \ escalated yet is a 200 with an empty `events` list."
      operationId: get_camera_events_cameras__camera_id__events_get
      parameters:
      - in: path
        name: camera_id
        required: true
        schema:
          title: Camera Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraEventsResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: "Recent events for one camera (volatile console cache \u2014 NOT the event store)"
