          title: Vram Mib
          type: integer
      required:
      - key
      - state
      - detail
      - vram_mib
      title: ModelHealth
      type: object
    RecentEventEntry:
      description: 'One event as the console sees it. A projection of the published anomaly event,

        not the event itself: `clip_uri` is absent because a clip is attached after the

        event is assembled and this view is written at assembly.'
      properties:
        description:
          description: "The scene description \u2014 unless `description_unavailable` is true, in which\
            \ case this is a metadata-derived stand-in and not a description of the scene."
          title: Description
          type: string
        description_unavailable:
          description: True when the vision model could not answer and this event was assembled from cheap
