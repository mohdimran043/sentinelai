# Generated by `python -m sentinel_ai.openapi_export` — do not edit by hand.
# Spec §3.2: the committed document must not drift from the running app;
# `tests/test_openapi_contract.py` fails the build when it does.
components:
  schemas:
    AcknowledgeRequest:
      additionalProperties: false
      properties:
        by:
          description: "Who is acknowledging. **This engine has no authentication**, so this is a self-declared\
            \ label and not an identity \u2014 it records what somebody typed, which is worth having and\
            \ is not an audit trail. See `docs/operations.md`."
          maxLength: 120
          minLength: 1
          title: By
          type: string
      required:
      - by
      title: AcknowledgeRequest
      type: object
    AlertEntry:
      description: "One ongoing situation an operator is asked to act on (spec \xA717).\n\n**Not an event.**\
        \ An event is what happened; an alert is an *episode* that events\naccumulate into. Measured on\
        \ real footage, forty-five seconds of one corridor\nproduced eleven events and would produce eleven\
        \ rows \u2014 `occurrences` is what turns\nthat back into one row saying how many times it happened."
      properties:
        acknowledged_at:
          anyOf:
          - type: number
          - type: 'null'
          title: Acknowledged At
        acknowledged_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Acknowledged By
        alert_id:
          format: uuid
          title: Alert Id
          type: string
        camera_id:
          title: Camera Id
          type: string
        camera_label:
          title: Camera Label
          type: string
        clip_uri:
          anyOf:
          - type: string
          - type: 'null'
          description: "The first contributing clip that finished, for the same reason. Null when no clip\
            \ has finished yet, which is normal early in an episode \u2014 clips complete after their\
            \ event is assembled. A storage URI, not a URL: it is here so an operator can say which object\
            \ an alert refers to. To *watch* it, GET /alerts/{alert_id}/clip, which is the only route\
            \ by which this engine will serve a recording."
          title: Clip Uri
        description:
          description: "The most recent contributing event's description. Most recent rather than first\
            \ because an episode develops \u2014 what is happening now is more use to somebody deciding\
            \ whether to go than what was happening a minute ago."
          title: Description
          type: string
        event_ids:
          description: The **first** contributing events, bounded. First rather than latest because an
            investigator works backwards from the start of an episode, and the oldest event is the one
            whose clip shows how it began.
          items:
            format: uuid
            type: string
          title: Event Ids
          type: array
        first_seen:
          title: First Seen
          type: number
        last_seen:
          description: "Unix epoch seconds, like `occurred_at` \u2014 sortable across cameras."
          title: Last Seen
          type: number
        notify_clip_uri:
          anyOf:
          - type: string
          - type: 'null'
          description: "The same recording trimmed to SENTINEL_NOTIFY_CLIP_SECONDS, when the writer made\
            \ one \u2014 what a notification carries, and what GET /alerts/{alert_id}/clip returns by\
            \ default. Null is ordinary: the engine may be configured to make no short copy, and the trim\
            \ can fail without costing the full clip. Null here while `clip_uri` is set means the short\
            \ request falls back to the full recording, never to nothing."
          title: Notify Clip Uri
        occurrences:
          description: How many events have folded into this episode. Always exact, even once `event_ids`
            stops being complete.
          title: Occurrences
          type: integer
        priority:
          $ref: '#/components/schemas/EventPriority'
          description: 'How urgently this should be served, known from the reason alone before any model
            has looked. Distinct from `severity`: severity is how bad the scene appears, priority is how
            bad it would be to get this one wrong.'
        reason:
          $ref: '#/components/schemas/EscalationReason'
          description: What kind of situation this is. The same vocabulary as an event's.
        severity:
          $ref: '#/components/schemas/Severity'
          description: "The worse of what the model saw and what the reason structurally implies, and\
            \ it **rises across an episode and never falls** \u2014 one calm frame must not drop an escalating\
            \ situation down the list."
        state:
          $ref: '#/components/schemas/AlertState'
          description: "`active` \u2014 nobody has looked. `acknowledged` \u2014 a person has seen it\
            \ and is dealing with it. `resolved` \u2014 a person has said it is finished. **Nothing here\
            \ changes on its own:** no alert ages out, because an alert that expired quietly would leave\
            \ no trace that nobody ever went to look."
        subject:
          description: Which tracked identity this episode is about, as a comma-separated list of track
            ids, or `""` for a camera-level finding with nobody to attribute it to (camera tampering).
            Two events with the same camera, reason and subject are the same episode; a different subject
            is a different person and a different alert.
          title: Subject
          type: string
        zone:
          anyOf:
          - $ref: '#/components/schemas/Zone'
          - type: 'null'
          description: Where the camera watches, or null when ungrouped.
      required:
      - alert_id
      - camera_id
      - camera_label
      - reason
      - subject
      - state
      - severity
      - priority
      - first_seen
      - last_seen
      - occurrences
      - description
      - event_ids
      title: AlertEntry
      type: object
    AlertState:
      enum:
      - active
      - acknowledged
      - resolved
      title: AlertState
      type: string
    AlertsResponse:
      properties:
        alerts:
          description: "Worst first, then most recent first. Ordered by the engine rather than left to\
            \ the client so that every reader agrees about what is at the top of the list \u2014 \xA7\
            27's requirement that the critical thing is visible immediately is a property of this ordering."
          items:
            $ref: '#/components/schemas/AlertEntry'
          title: Alerts
          type: array
        open_count:
          description: "How many are not yet resolved \u2014 the number worth putting on a badge."
          title: Open Count
          type: integer
      required:
      - alerts
      - open_count
      title: AlertsResponse
      type: object
    Body_enroll_face_authorized_persons__person_id__faces_post:
      properties:
        image:
          contentMediaType: application/octet-stream
          title: Image
          type: string
      required:
      - image
      title: Body_enroll_face_authorized_persons__person_id__faces_post
      type: object
    CameraCreateRequest:
      additionalProperties: false
      description: "A new camera, as the console describes one.\n\n`url` is here and is absent from `CameraEditRequest`,\
        \ and that asymmetry is the\ndesign: changing a running camera's source means tearing down its\
        \ runner, its\npre-roll and any clip mid-recording, while adding one destroys nothing.\n\n`profile`\
        \ is absent from both. The escalation policy has live state \u2014 cooldowns, a\npart-filled token\
        \ bucket \u2014 so a new camera starts on the defaults and tuning it is\nstill `cameras.json`\
        \ and a restart."
      properties:
        camera_id:
          maxLength: 64
          minLength: 1
          title: Camera Id
          type: string
        capabilities:
          anyOf:
          - items:
              $ref: '#/components/schemas/Capability'
            type: array
          - type: 'null'
          description: "Null takes the engine's defaults. A capability whose model this process never\
            \ loaded is refused with a 409 naming the restart \u2014 which models exist is decided at\
            \ startup."
          title: Capabilities
        label:
          default: ''
          maxLength: 120
          title: Label
          type: string
        url:
          description: An rtsp(s) URL, an earthcam.com **page** URL, or a local file path. Which source
            gets built is decided from this and nothing else.
          maxLength: 2048
          minLength: 1
          title: Url
          type: string
        zone:
          anyOf:
          - $ref: '#/components/schemas/Zone'
          - type: 'null'
          description: The group this camera belongs to. Null leaves it ungrouped.
      required:
      - camera_id
      - url
      title: CameraCreateRequest
      type: object
    CameraEditRequest:
      additionalProperties: false
      description: "A partial edit to one camera's record: its label, its zone, and its welfare\nnotification\
        \ policy, in any combination.\n\nPartial on purpose \u2014 a console changing a label must not\
        \ have to restate a zone\nit is not touching, because restating it is how one operator's window\
        \ silently\nreverts another's change.\n\n**Only the runtime-editable fields are accepted, and\
        \ the rest are rejected\nrather than ignored.** `extra=\"forbid\"` means a body carrying `url`\
        \ or\n`profile` is a 422 naming the field, not a 200 that quietly dropped it. That\nis the whole\
        \ reason the model is strict: the failure this endpoint must never\nhave is an operator re-pointing\
        \ a camera at a new stream, being told it\nworked, and watching the old stream for a week."
      properties:
        capabilities:
          anyOf:
          - items:
              $ref: '#/components/schemas/Capability'
            type: array
          - type: 'null'
          description: "Which AI capabilities run on this camera, replacing whatever is configured now\
            \ \u2014 a whole new list, not an addition to the old one. **`[]` means run nothing on this\
            \ camera**, which is a real instruction and not an empty edit: the camera stays watched and\
            \ decoded, and no model is run against it. Omit the field to leave the capabilities alone;\
            \ `null` is rejected, because `[]` already says the only thing it could mean.\n\n**A capability\
            \ can only be enabled if this process already loaded the model it needs.** Which models exist\
            \ is decided once, at startup, from the union over every configured camera (see `GET /cameras`),\
            \ because loading a 3B vision model is a multi-second download-and-place that cannot happen\
            \ under an HTTP request without stalling every camera sharing the GPU. Enabling one whose\
            \ model is absent is a 409 naming the restart, never a 200 that quietly did nothing \u2014\
            \ the same fail-loud this endpoint applies to `url`. Disabling is always allowed."
          title: Capabilities
        clip_postroll_seconds:
          anyOf:
          - exclusiveMinimum: 0.0
            type: number
          - type: 'null'
          description: "Seconds of video to keep recording after a notified concern's keyframe, for this\
            \ camera only. `null` reverts it to the engine-wide default; omitting the field leaves it\
            \ as configured. Must be greater than zero \u2014 a clip that ends where it begins is not\
            \ a shorter clip, it is no clip."
          title: Clip Postroll Seconds
        clip_preroll_seconds:
          anyOf:
          - minimum: 0.0
            type: number
          - type: 'null'
          description: "Seconds of buffered video to keep before a notified concern's keyframe, for this\
            \ camera only. `null` reverts it to the engine-wide default; omitting the field leaves it\
            \ as configured \u2014 **the two are different instructions**, the same way `zone`'s are.\
            \ `0` is allowed and means no lead-in at all, which is why this bound is `>= 0` where the\
            \ other two durations are `> 0`."
          title: Clip Preroll Seconds
        label:
          anyOf:
          - maxLength: 120
            minLength: 1
            type: string
          - type: 'null'
          description: "The camera's new display name. Trimmed; must be non-empty after trimming. Omit\
            \ the field to leave the label alone \u2014 `null` is not a label and is rejected."
          title: Label
        notify_min_confidence:
          anyOf:
          - $ref: '#/components/schemas/Confidence'
          - type: 'null'
          description: "The lowest confidence tier that may notify. `likely` is the engine's default;\
            \ `possible` widens it to everything the model flags at all, which on an ordinary day is most\
            \ of its opinions. Omit to leave the threshold alone; `null` is rejected, because a camera\
            \ has no 'no threshold' state. There are exactly two tiers and there is no `certain` \u2014\
            \ see `domain/welfare.py`: one still frame cannot earn it."
        notify_on:
          anyOf:
          - items:
              $ref: '#/components/schemas/ConcernKind'
            type: array
          - type: 'null'
          description: "Which welfare concern kinds this camera notifies a human about, replacing whatever\
            \ is configured now \u2014 this is a whole new list, not an addition to the old one. **`[]`\
            \ means never notify from this camera**, which is a real instruction and not an empty edit:\
            \ it silences one camera without turning welfare monitoring off anywhere else. Omit the field\
            \ to leave the routing alone; `null` is rejected, because `[]` already covers the only thing\
            \ it could have meant. A kind outside the enum is a 422 rather than a silent narrowing of\
            \ the list \u2014 a typo'd kind is a concern the operator meant to be told about and would\
            \ not be."
          title: Notify On
        summary_interval_seconds:
          anyOf:
          - exclusiveMinimum: 0.0
            type: number
          - type: 'null'
          description: "How often this camera's periodic summary runs. `null` reverts it to the camera\
            \ profile's interval; omitting the field leaves it as configured. Distinct from `profile.summary_interval_seconds`,\
            \ which is restart-only \u2014 this is the runtime-editable override of it, and it wins where\
            \ both are set."
          title: Summary Interval Seconds
        zone:
          anyOf:
          - $ref: '#/components/schemas/Zone'
          - type: 'null'
          description: "The camera's new zone, or `null` to ungroup it. Unlike `label`, `null` here is\
            \ a real instruction, so **omitting the field and sending null mean different things**: omit\
            \ to leave the grouping alone, send null to remove it. A value outside the enum is a 422 \u2014\
            \ the same fail-loud `load_cameras` applies at startup, because a typo'd zone is a camera\
            \ the operator meant to group and silently did not."
      title: CameraEditRequest
      type: object
    CameraEditResponse:
      description: 'The camera''s record as `cameras.json` now holds it, after a successful edit.


        The whole record rather than an acknowledgement: a console that has just

        written should render what was stored, not what it hoped was stored.'
      properties:
        camera_id:
          title: Camera Id
          type: string
        capabilities:
          description: "The capabilities now stored for this camera, sorted \u2014 always the full list,\
            \ never a diff. `[]` means nothing runs on this camera. Identical in meaning to `CameraStatus.capabilities`,\
            \ so a console can compare what it wrote against what it later reads there."
          items:
            $ref: '#/components/schemas/Capability'
          title: Capabilities
          type: array
        clip_postroll_seconds:
          anyOf:
          - type: number
          - type: 'null'
          description: 'As `clip_preroll_seconds`: the stored override, or null for the default.'
          title: Clip Postroll Seconds
        clip_preroll_seconds:
          anyOf:
          - type: number
          - type: 'null'
          description: "The stored per-camera override, or null when this camera uses the engine-wide\
            \ default. Null here is the answer to 'what is stored', not a report of the effective value\
            \ \u2014 the default in force is not this endpoint's to state."
          title: Clip Preroll Seconds
        label:
          title: Label
          type: string
        notify_min_confidence:
          $ref: '#/components/schemas/Confidence'
          description: 'The stored confidence threshold. Never null: a camera always has one.'
        notify_on:
          description: "The concern kinds this camera will notify on, as stored \u2014 always the full\
            \ list, never a diff, and sorted so two reads of the same record compare equal. A camera whose\
            \ file says nothing about `notify_on` lists every kind here, because that is what saying nothing\
            \ means. `[]` means this camera notifies nobody."
          items:
            $ref: '#/components/schemas/ConcernKind'
          title: Notify On
          type: array
        persisted:
          const: true
          default: true
          description: 'Always true, and present so it cannot be overlooked: this edit was written to
            the engine''s `cameras.json` before this response was sent, and survives a restart. An edit
            that could not be written is an error response, never a 200 with this set to false.'
          title: Persisted
          type: boolean
        restart_required_fields:
          description: "Fields of the camera record that this endpoint will not change at all: they are\
            \ stored in `cameras.json`, honoured at startup, and require editing that file and restarting\
            \ the engine. `url` because changing it means tearing down the running camera and building\
            \ a new source (and because an RTSP URL routinely carries credentials, which an unauthenticated\
            \ API must not move in either direction); `profile` because it is the escalation policy the\
            \ gate is part-way through applying. Sending either one is a 422, not a silent drop \u2014\
            \ a console should show them as read-only and say why, not offer a control that does nothing."
          items:
            type: string
          title: Restart Required Fields
          type: array
        summary_interval_seconds:
          anyOf:
          - type: number
          - type: 'null'
          description: The stored override, or null when this camera falls back to its profile's `summary_interval_seconds`.
          title: Summary Interval Seconds
        zone:
          anyOf:
          - $ref: '#/components/schemas/Zone'
          - type: 'null'
          description: The stored zone, or null when the camera is ungrouped.
        zone_kind:
          anyOf:
          - $ref: '#/components/schemas/ZoneKind'
          - type: 'null'
          description: Derived from `zone`, exactly as on `CameraStatus`. Null when `zone` is.
      required:
      - camera_id
      - label
      - zone
      - zone_kind
      - capabilities
      - notify_on
      - notify_min_confidence
      - clip_preroll_seconds
      - clip_postroll_seconds
      - summary_interval_seconds
      title: CameraEditResponse
      type: object
    CameraEnabledRequest:
      additionalProperties: false
      description: 'Which way to move the switch.


        A body rather than two verbs (`/enable`, `/disable`) so the request is idempotent

        in the literal sense: it states the state it wants, not the transition, and sending

        it twice asks for the same thing twice.'
      properties:
        enabled:
          description: '`true` to start watching this camera, `false` to stop.'
          title: Enabled
          type: boolean
      required:
      - enabled
      title: CameraEnabledRequest
      type: object
    CameraEventsResponse:
      description: 'A **volatile, bounded, in-memory view for the operator console. Not the event

        store, and not an audit trail.**


        The durable record of what happened is RabbitMQ plus the Phase 1C consumer that

        writes it down. This endpoint reads an in-process ring that (a) is emptied by any

        restart of the engine, and (b) silently discards a camera''s oldest entry once that

        camera has produced more than `capacity` events. An absent event here therefore

        means "not in the last `capacity` events of this process run" and never "did not

        happen". Do not reconcile against it, do not report from it, and do not use it to

        establish that nothing occurred.'
      properties:
        camera_id:
          title: Camera Id
          type: string
        capacity:
          description: "The per-camera ring bound. Once `returned` reaches it, every new event silently\
            \ evicts the oldest \u2014 published here so a console can say how much history it is not\
            \ showing."
          title: Capacity
          type: integer
        events:
          description: "Retained events, oldest first \u2014 plot them in this order."
          items:
            $ref: '#/components/schemas/RecentEventEntry'
          title: Events
          type: array
        latest:
          anyOf:
          - $ref: '#/components/schemas/RecentEventEntry'
          - type: 'null'
          description: The most recent event, i.e. the last element of `events`, lifted out for the live
            scene panel. Read from the same snapshot as `events`, so the panel and the chart can never
            disagree about which event is newest. Null exactly when `latest_description_state` is 'none'.
        latest_description_state:
          description: Whether the live panel has a real description ('available'), a stand-in because
            the vision model could not answer ('unavailable'), or nothing at all yet ('none').
          enum:
          - none
          - available
          - unavailable
          title: Latest Description State
          type: string
        returned:
          description: How many events this response carries.
          title: Returned
          type: integer
        volatile:
          const: true
          default: true
          description: 'Always true, and present so it cannot be overlooked: this history is held in engine
            memory only and does not survive a restart. The event store is elsewhere.'
          title: Volatile
          type: boolean
      required:
      - camera_id
      - capacity
      - returned
      - latest_description_state
      - latest
      - events
      title: CameraEventsResponse
      type: object
    CameraStatus:
      properties:
        camera_id:
          title: Camera Id
          type: string
        capabilities:
          description: "Which AI capabilities are running on this camera, as the engine has them \u2014\
            \ always the full list, never a diff, and sorted so two reads of the same record compare equal.\
            \ `[]` is a stored choice, not an unset field: the camera is watched and decoded, and nothing\
            \ is run on it. **Render this as what the engine is doing, not as what the file asked for**\
            \ \u2014 it is read back off the running camera, which is what makes a capability checkbox\
            \ honest rather than decorative. A capability absent here is one no model was loaded for."
          items:
            $ref: '#/components/schemas/Capability'
          title: Capabilities
          type: array
        clip_postroll_seconds:
          anyOf:
          - type: number
          - type: 'null'
          description: 'As `clip_preroll_seconds`: the stored override, or null for the default.'
          title: Clip Postroll Seconds
        clip_preroll_seconds:
          anyOf:
          - type: number
          - type: 'null'
          description: "The stored per-camera override, or null when this camera follows the engine-wide\
            \ default. **Null is the answer to 'what is stored', not a report of the effective value**\
            \ \u2014 the same meaning `CameraEditResponse` gives it. A console that resolved it locally\
            \ and then submitted what it showed would pin the camera to a number nobody chose and opt\
            \ it out of any later change to the default."
          title: Clip Preroll Seconds
        detections_run:
          title: Detections Run
          type: integer
        discontinuities:
          title: Discontinuities
          type: integer
        enabled:
          default: true
          description: "Whether the engine is watching this camera at all. `false` is a camera an operator\
            \ deliberately stopped: the record is still in `cameras.json`, it still has a label, a zone\
            \ and a capability set, and no source connection is open. Distinct from a camera with no capabilities,\
            \ which still pulls and decodes every frame. **The counters on a disabled camera are frozen\
            \ at the moment it was stopped, not zeroed** \u2014 except after a restart, when they are\
            \ genuinely zero because nothing has been watched this run."
          title: Enabled
          type: boolean
        escalations:
          title: Escalations
          type: integer
        escalations_dropped:
          title: Escalations Dropped
          type: integer
        falls_suspected:
          default: 0
          description: "How many fall signatures have completed on this camera since the engine started.\
            \ Always 0 on a camera without the `fall_detection` capability, and 0 is not the same claim\
            \ as absent \u2014 it means the machine ran and saw nothing. Cumulative and monotonic within\
            \ one process run; it resets on restart, like every other counter here. **Not a count of falls**:\
            \ it is a count of times a geometry state machine's signature completed and a vision-language\
            \ model was asked to confirm. See the camera's events for what the model then said."
          title: Falls Suspected
          type: integer
        frames_dropped:
          title: Frames Dropped
          type: integer
        frames_seen:
          title: Frames Seen
          type: integer
        label:
          description: "The camera's display name, from `cameras.json`; defaults to `camera_id` when the\
            \ file gives none. Editable at runtime via `PATCH /cameras/{camera_id}` \u2014 read it back\
            \ from here after a write to see what the engine is actually using."
          title: Label
          type: string
        last_escalation_at:
          anyOf:
          - type: number
          - type: 'null'
          title: Last Escalation At
        last_frame_at:
          anyOf:
          - type: number
          - type: 'null'
          description: "When the last frame arrived, on **this camera's own source timeline** \u2014 `time.monotonic()`\
            \ for a live RTSP camera, seconds-from-start-of-file for a replayed one. It is what correlates\
            \ telemetry with a clip's pts, and it is **not** a wall-clock time: it resets on restart and\
            \ two cameras do not share an origin. Never render it as an age \u2014 use `last_frame_epoch`."
          title: Last Frame At
        last_frame_epoch:
          anyOf:
          - type: number
          - type: 'null'
          description: "When this camera was last **observed** to have delivered a frame, in Unix epoch\
            \ seconds. This is the field a liveness indicator reads.\n\nSeparate from `last_frame_at`\
            \ because that one cannot answer the question: reading a source timeline as an epoch put every\
            \ camera at '20712d ago' and reported '0 of 3 delivering' while all three were. Observational\
            \ \u2014 it is stamped when a read notices the source timeline has advanced \u2014 so it is\
            \ as fresh as the last time somebody asked, which for a polling console is every few seconds.\
            \ Null when this camera has not been seen to deliver anything yet."
          title: Last Frame Epoch
        notify_min_confidence:
          $ref: '#/components/schemas/Confidence'
          description: 'The stored confidence threshold. Never null: a camera always has one.'
        notify_on:
          description: "The concern kinds this camera will notify a human about, as stored \u2014 always\
            \ the full list, never a diff, and sorted so two reads of the same record compare equal. A\
            \ camera whose file says nothing about `notify_on` lists every kind, because that is what\
            \ saying nothing means. `[]` means this camera notifies nobody, which is a stored choice rather\
            \ than an unset field: **render it as muted, not as unconfigured.** Identical in meaning to\
            \ `CameraEditResponse.notify_on`, so a console can compare what it wrote against what it later\
            \ reads here."
          items:
            $ref: '#/components/schemas/ConcernKind'
          title: Notify On
          type: array
        summary_interval_seconds:
          anyOf:
          - type: number
          - type: 'null'
          description: The stored override, or null when this camera falls back to its profile's `summary_interval_seconds`.
          title: Summary Interval Seconds
        zone:
          anyOf:
          - $ref: '#/components/schemas/Zone'
          - type: 'null'
          description: "Which space this camera watches \u2014 the field cameras are grouped by. Null\
            \ means ungrouped: nobody has assigned this camera a zone. Null is not a group; do not render\
            \ it as one alongside the real zones."
        zone_kind:
          anyOf:
          - $ref: '#/components/schemas/ZoneKind'
          - type: 'null'
          description: The coarse grouping `zone` falls into, derived from it and never stored separately,
            so the two cannot disagree. Null exactly when `zone` is null.
      required:
      - camera_id
      - label
      - frames_seen
      - frames_dropped
      - detections_run
      - escalations
      - escalations_dropped
      - discontinuities
      - last_frame_at
      - last_escalation_at
      - capabilities
      - notify_on
      - notify_min_confidence
      - clip_preroll_seconds
      - clip_postroll_seconds
      - summary_interval_seconds
      title: CameraStatus
      type: object
    CameraStorageModel:
      properties:
        bytes_used:
          title: Bytes Used
          type: integer
        camera_id:
          title: Camera Id
          type: string
        clips:
          title: Clips
          type: integer
      required:
      - camera_id
      - clips
      - bytes_used
      title: CameraStorageModel
      type: object
    CamerasResponse:
      properties:
        cameras:
          items:
            $ref: '#/components/schemas/CameraStatus'
          title: Cameras
          type: array
        config_writable:
          description: "Whether `PATCH /cameras/{camera_id}` will do anything on this deployment. False\
            \ \u2014 the default \u2014 means the write endpoint answers 403 and the camera record can\
            \ only be changed by editing `cameras.json` and restarting. This engine has **no authentication**,\
            \ so writes are opt-in per deployment (`SENTINEL_ENABLE_CAMERA_WRITES`); see the PATCH operation's\
            \ description. Published here so a console can render the record read-only rather than offering\
            \ controls that will 403."
          title: Config Writable
          type: boolean
      required:
      - cameras
      - config_writable
      title: CamerasResponse
      type: object
    Capability:
      description: "What an operator turns on for one camera.\n\n`StrEnum` so it serialises as its own\
        \ wire value with no encoder \u2014 the same reason\n`Zone` and `ConcernKind` are."
      enum:
      - scene_description
      - anomaly_detection
      - fall_detection
      - abandoned_object
      - camera_tamper
      - person_authorization
      - zone_monitoring
      title: Capability
      type: string
    ClipRecordModel:
      properties:
        event_id:
          format: uuid
          title: Event Id
          type: string
        has_short_copy:
          title: Has Short Copy
          type: boolean
        modified_at:
          description: "Unix epoch seconds, from the object store's record of when the upload finished\
            \ \u2014 **later than the incident** by the post-roll plus the upload. Sort by it; do not\
            \ present it as the time something happened."
          title: Modified At
          type: number
        size_bytes:
          title: Size Bytes
          type: integer
      required:
      - event_id
      - size_bytes
      - modified_at
      - has_short_copy
      title: ClipRecordModel
      type: object
    ClipsResponse:
      properties:
        camera_id:
          title: Camera Id
          type: string
        clips:
          items:
            $ref: '#/components/schemas/ClipRecordModel'
          title: Clips
          type: array
      required:
      - camera_id
      - clips
      title: ClipsResponse
      type: object
    ConcernKind:
      description: What the VLM's welfare-focused prompt asks the frame to be checked for.
      enum:
      - collapse
      - altercation
      - self_harm
      - medication
      - distress
      - other
      title: ConcernKind
      type: string
    Confidence:
      description: 'How sure a single still frame can honestly make the model.


        Deliberately two members, not three: see the module docstring for why

        there is no `CERTAIN`.'
      enum:
      - possible
      - likely
      title: Confidence
      type: string
    DescribeResponse:
      properties:
        event_id:
          format: uuid
          title: Event Id
          type: string
      required:
      - event_id
      title: DescribeResponse
      type: object
    EnrolledFaceEntry:
      description: "One reference face on a person's record.\n\nMetadata only \u2014 the picture is fetched\
        \ one at a time from its own endpoint. A list\nthat inlined the images would move every enrolled\
        \ person's biometric data across the\nnetwork to draw a table of names, which is the opposite\
        \ of \xA712's \"do not expose\nbiometric information unnecessarily\"."
      properties:
        enrolled_at:
          anyOf:
          - type: number
          - type: 'null'
          description: Unix epoch seconds, or null for a face enrolled before this was recorded. Null
            means unknown, never 1970.
          title: Enrolled At
        face_id:
          format: uuid
          title: Face Id
          type: string
        has_image:
          description: 'Whether a reference photograph was kept. False is a real answer, not a loading
            state: enrolment can keep the embedding and no picture.'
          title: Has Image
          type: boolean
      required:
      - face_id
      - has_image
      title: EnrolledFaceEntry
      type: object
    EscalationReason:
      description: "Why a frame was escalated to the vision-language model.\n\nThe seven from spec \xA7\
        4.1, plus `FALL_SUSPECTED` (\xA77), which is a different kind of\nthing from the rest and is grouped\
        \ last for that reason. The first six are\n*predicates on one frame* asking \"is this scene worth\
        \ a look\"; `USER_REQUESTED` is\na person asking directly; `FALL_SUSPECTED` is a **temporal state\
        \ machine** over\nseveral seconds reporting that a specific signature completed\n(`domain/behaviour/fall.py`)."
      enum:
      - new_salient_track
      - scene_change
      - dwell_exceeded
      - speed_anomaly
      - track_count_spike
      - periodic_summary
      - user_requested
      - fall_suspected
      - abandoned_object
      - camera_tamper
      - zone_intrusion
      - line_crossing
      - unauthorized_person
      title: EscalationReason
      type: string
    EventPriority:
      description: "\xA716's four bands, as an ordered vocabulary.\n\nA `StrEnum` rather than an int so\
        \ it serialises and reads as itself, with\n`_RANK` below supplying the ordering \u2014 the same\
        \ arrangement `Confidence.meets`\nuses, and for the same reason: `EventPriority.LOW > EventPriority.CRITICAL`\
        \ is\n`True` by alphabet, which is the exact inversion of what anyone writing it means."
      enum:
      - critical
      - high
      - medium
      - low
      title: EventPriority
      type: string
    FacesResponse:
      properties:
        faces:
          items:
            $ref: '#/components/schemas/EnrolledFaceEntry'
          title: Faces
          type: array
      required:
      - faces
      title: FacesResponse
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    HealthResponse:
      properties:
        models:
          items:
            $ref: '#/components/schemas/ModelHealth'
          title: Models
          type: array
        status:
          title: Status
          type: string
      required:
      - status
      - models
      title: HealthResponse
      type: object
    ModelHealth:
      properties:
        detail:
          title: Detail
          type: string
        key:
          title: Key
          type: string
        state:
          title: State
          type: string
        vram_mib:
          title: Vram Mib
          type: integer
      required:
      - key
      - state
      - detail
      - vram_mib
      title: ModelHealth
      type: object
    PeopleResponse:
      properties:
        people:
          items:
            $ref: '#/components/schemas/PersonEntry'
          title: People
          type: array
      required:
      - people
      title: PeopleResponse
      type: object
    PersonEntry:
      description: "One enrolled person, as a console lists them (spec \xA723).\n\n**Carries no biometric\
        \ data.** No embedding, no vector, no image \u2014 those live in\nthe encrypted store and never\
        \ travel on this API. What a console shows is a name, a\nstatus and where somebody is authorised,\
        \ and that is deliberately all it can show:\n\xA712 asks that biometric information is not exposed\
        \ unnecessarily, and the necessary\namount here is none.\n\n`reference_faces` is a count rather\
        \ than the faces themselves, for the same reason.\nThe faces have their own endpoint, and their\
        \ photographs one each \u2014 see\n`EnrolledFaceEntry`.\nIt is worth showing because \xA710 asks\
        \ for multiple references per person and \"1\" is\nusually the reason somebody is not being recognised."
      properties:
        camera_ids:
          description: "Cameras this person is authorised on. **Empty means none, not all** \u2014 a person\
            \ enrolled with no cameras assigned is authorised nowhere until somebody says where. The opposite\
            \ default would make forgetting to set this a silent grant."
          items:
            type: string
          title: Camera Ids
          type: array
        display_name:
          title: Display Name
          type: string
        expires_at:
          anyOf:
          - type: number
          - type: 'null'
          description: "Unix epoch seconds after which this authorisation lapses, or null for no expiry.\
            \ \xA710's temporary authorisation \u2014 without it every temporary grant becomes a permanent\
            \ one somebody forgot to revoke."
          title: Expires At
        external_reference:
          anyOf:
          - type: string
          - type: 'null'
          title: External Reference
        notes:
          default: ''
          title: Notes
          type: string
        person_id:
          format: uuid
          title: Person Id
          type: string
        reference_faces:
          description: How many reference faces are enrolled. A count, never the faces. One is usually
            the reason somebody is not being recognised from an angle.
          title: Reference Faces
          type: integer
        status:
          $ref: '#/components/schemas/PersonStatus'
        zones:
          description: Zone names authorised, as an alternative to cameras.
          items:
            type: string
          title: Zones
          type: array
      required:
      - person_id
      - display_name
      - status
      - camera_ids
      - zones
      - reference_faces
      title: PersonEntry
      type: object
    PersonRequest:
      additionalProperties: false
      description: "Create or replace an authorised person. Carries no biometric data either \u2014\n\
        faces are enrolled separately, against an existing person."
      properties:
        camera_ids:
          description: Cameras to authorise on. Empty authorises nowhere.
          items:
            type: string
          title: Camera Ids
          type: array
        display_name:
          maxLength: 120
          minLength: 1
          title: Display Name
          type: string
        expires_at:
          anyOf:
          - type: number
          - type: 'null'
          title: Expires At
        external_reference:
          anyOf:
          - maxLength: 120
            type: string
          - type: 'null'
          description: "A site's own identifier \u2014 staff number, badge id. Opaque here and never used\
            \ for matching; it exists so an operator can reconcile this record with whatever system actually\
            \ governs employment."
          title: External Reference
        notes:
          default: ''
          maxLength: 2000
          title: Notes
          type: string
        status:
          $ref: '#/components/schemas/PersonStatus'
          default: active
        zones:
          items:
            type: string
          title: Zones
          type: array
      required:
      - display_name
      title: PersonRequest
      type: object
    PersonStatus:
      description: "Whether an enrolled person's authorisation is currently in force.\n\n`DISABLED` rather\
        \ than deletion is the point: \xA712 requires an audit trail and a\ndeletion function, and those\
        \ are different operations. Disabling revokes access\nwhile keeping the record of who was authorised\
        \ and when \u2014 which is what an\ninvestigation of a past incident needs. Deleting removes the\
        \ biometric data, which\nis what a person exercising a data right needs. Conflating them means\
        \ one of those\ntwo obligations cannot be met."
      enum:
      - active
      - disabled
      title: PersonStatus
      type: string
    ProbeRequest:
      additionalProperties: false
      description: Look at a stream before committing to it.
      properties:
        url:
          maxLength: 2048
          minLength: 1
          title: Url
          type: string
      required:
      - url
      title: ProbeRequest
      type: object
    ProbeResponse:
      description: 'What one look at a stream found.


        `ok` false is a normal answer, not an error status: the caller is rendering a

        preview either way, and a 4xx would make "this URL is wrong" indistinguishable from

        "the request was malformed".'
      properties:
        codec:
          default: ''
          title: Codec
          type: string
        detail:
          title: Detail
          type: string
        fps:
          default: 0.0
          title: Fps
          type: number
        height:
          default: 0
          title: Height
          type: integer
        ok:
          title: Ok
          type: boolean
        source_kind:
          description: "`earthcam`, `rtsp` or `file` \u2014 which source the engine would build."
          title: Source Kind
          type: string
        thumbnail:
          anyOf:
          - type: string
          - type: 'null'
          description: "One decoded frame as a `data:image/jpeg;base64,\u2026` URL, or null. The point\
            \ of a preview: a stream that opens and decodes green looks identical to a working one in\
            \ every other field here."
          title: Thumbnail
        title:
          default: ''
          title: Title
          type: string
        width:
          default: 0
          title: Width
          type: integer
      required:
      - ok
      - detail
      - source_kind
      title: ProbeResponse
      type: object
    RecentEventEntry:
      description: "One event as the console sees it \u2014 a projection of the published anomaly event,\n\
        not the event itself.\n\nThe same shape is served three ways: in `GET /cameras/{camera_id}/events`,\
        \ in the\n`backlog` array that opens `GET /events/stream`, and in each live frame on that\nstream.\
        \ One shape on purpose, so a console can merge all three into one list\nkeyed by `event_id`, keeping\
        \ the copy with the highest `sequence`."
      properties:
        camera_id:
          description: Which camera produced this. Redundant on the per-camera endpoint, and essential
            on `/events/stream`, which carries every camera's events.
          title: Camera Id
          type: string
        clip_uri:
          anyOf:
          - type: string
          - type: 'null'
          description: "Where this event's clip was written, or null. Null covers three different situations\
            \ and is not by itself evidence of any one of them: no clip was being recorded, the clip has\
            \ not finished uploading yet (it lands shortly after the event, and the event is then re-sent\
            \ on the stream with a higher `sequence`), or the clip failed to write. An event is never\
            \ withheld because its clip failed \u2014 spec \xA79 \u2014 so a null here says nothing at\
            \ all about whether the event happened."
          title: Clip Uri
        description:
          description: "The scene description \u2014 unless `description_unavailable` is true, in which\
            \ case this is a metadata-derived stand-in and not a description of the scene."
          title: Description
          type: string
        description_unavailable:
          description: True when the vision model could not answer and this event was assembled from cheap
            signals alone. Never conflate it with the absence of an event.
          title: Description Unavailable
          type: boolean
        event_id:
          format: uuid
          title: Event Id
          type: string
        labels:
          items:
            type: string
          title: Labels
          type: array
        occurred_at:
          description: "Unix epoch seconds (UTC, fractional). Sort and plot on this \u2014 it is the same\
            \ field, with the same meaning, as the published event's `occurred_at`."
          title: Occurred At
          type: number
        reason:
          description: Which of the seven escalation triggers fired.
          title: Reason
          type: string
        sequence:
          description: "This version's position in the engine's write order for the recent-event ring\
            \ \u2014 a de-duplication key, never a sort key. An event can be sent more than once with\
            \ the same `event_id`: it is re-sent when something about it changes, currently when its clip\
            \ finishes uploading and `clip_uri` appears. The copy with the higher `sequence` is the newer\
            \ one; two copies with the same `sequence` are the same copy. Per process and monotonic \u2014\
            \ it restarts from zero when the engine does, exactly like the ring itself, so never persist\
            \ it or compare it across a restart."
          title: Sequence
          type: integer
        severity:
          description: The band `threat_score` falls in.
          title: Severity
          type: string
        source_timestamp:
          anyOf:
          - type: number
          - type: 'null'
          description: The camera source's own timeline for the same instant. Correlates with a clip's
            pts; meaningful only within one process run for one camera, so never sort or display on it.
          title: Source Timestamp
        suggested_action:
          title: Suggested Action
          type: string
        threat_score:
          description: The threat value, 0.0 to 1.0.
          maximum: 1.0
          minimum: 0.0
          title: Threat Score
          type: number
        track_ids:
          items:
            type: integer
          title: Track Ids
          type: array
        welfare_concerns:
          description: "What the vision model said about a person's wellbeing in this frame \u2014 **an\
            \ opinion about one still frame, not a detector's finding.** Empty means it reported nothing,\
            \ which is not evidence that nothing happened; when `description_unavailable` is true it means\
            \ the model could not answer at all. Always a list, never absent.\n\n**Not filtered by the\
            \ camera's `notify_on`.** That policy decides which concerns are pushed to somebody who is\
            \ *not* watching the console; every concern the model reported appears here, so muting a camera\
            \ silences its notifications without also blinding the operator reading its events."
          items:
            $ref: '#/components/schemas/WelfareConcernEntry'
          title: Welfare Concerns
          type: array
      required:
      - event_id
      - camera_id
      - sequence
      - clip_uri
      - occurred_at
      - source_timestamp
      - reason
      - threat_score
      - severity
      - description
      - suggested_action
      - description_unavailable
      - labels
      - track_ids
      - welfare_concerns
      title: RecentEventEntry
      type: object
    SettingEntryModel:
      description: One configuration value, as the running process holds it.
      properties:
        group:
          title: Group
          type: string
        is_default:
          description: Whether this is the value the engine ships with. False means this deployment moved
            it.
          title: Is Default
          type: boolean
        name:
          description: The environment variable an operator would set.
          title: Name
          type: string
        secret:
          title: Secret
          type: boolean
        value:
          description: "The effective value, rendered for reading. For a credential this is `(set)` or\
            \ `(unset)` and never the value \u2014 see `config_report.SECRET_FIELDS`."
          title: Value
          type: string
      required:
      - name
      - value
      - is_default
      - secret
      - group
      title: SettingEntryModel
      type: object
    SettingsResponse:
      description: "What this engine is configured to do.\n\nRead-only, and it is worth saying why: almost\
        \ nothing here can change without a\nrestart \u2014 which models to load, how much VRAM to budget,\
        \ where the broker is \u2014 and\nan endpoint that accepted a write would have to either lie about\
        \ taking effect or\nrestart the engine under an operator who asked for a settings change. The\
        \ two\nthings that *are* live are already editable where they belong, per camera."
      properties:
        changed:
          description: How many settings this deployment has moved off their default. The number worth
            reading first.
          title: Changed
          type: integer
        settings:
          items:
            $ref: '#/components/schemas/SettingEntryModel'
          title: Settings
          type: array
      required:
      - settings
      - changed
      title: SettingsResponse
      type: object
    Severity:
      enum:
      - info
      - low
      - medium
      - high
      - critical
      title: Severity
      type: string
    StorageResponse:
      description: What the clip bucket holds.
      properties:
        bucket:
          title: Bucket
          type: string
        bytes_used:
          title: Bytes Used
          type: integer
        clips:
          description: Recordings, counting a clip and its short copy as one.
          title: Clips
          type: integer
        objects:
          description: "Objects, which is what the store bills for \u2014 roughly twice `clips`."
          title: Objects
          type: integer
        per_camera:
          items:
            $ref: '#/components/schemas/CameraStorageModel'
          title: Per Camera
          type: array
        reachable:
          description: "False when the object store could not be listed. Every count is then zero and\
            \ means nothing \u2014 a console must say so rather than draw an empty bucket, which reads\
            \ as evidence having been deleted."
          title: Reachable
          type: boolean
        retention_days:
          description: How long a clip survives, enforced by the object store's own lifecycle rule. `0`
            means nothing expires.
          title: Retention Days
          type: integer
      required:
      - bucket
      - reachable
      - clips
      - objects
      - bytes_used
      - retention_days
      - per_camera
      title: StorageResponse
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    WelfareConcernEntry:
      description: "One welfare concern as the console reads it.\n\nThe wire form of `domain.welfare.WelfareConcern`,\
        \ minus the assessment's\n`basis` \u2014 which has exactly one value today, so repeating it on\
        \ every concern\nwould be noise. A second basis is a deliberate change that rewrites the\nrouting\
        \ rule and the console's wording together (ADR 10), not something a\nconsumer should be silently\
        \ reading for."
      properties:
        confidence:
          $ref: '#/components/schemas/Confidence'
          description: 'The model''s own uncertainty, not a thresholded score. There are exactly two tiers
            and there is no `certain`: one still frame cannot earn it.'
        evidence:
          description: "What the model says it actually saw, in its own words \u2014 **unless** `evidence_stated`\
            \ is false, in which case this is a fixed placeholder and the model described nothing. Never\
            \ render one as the other."
          title: Evidence
          type: string
        evidence_stated:
          description: "False when the model named this concern but described nothing. The concern still\
            \ routes and still displays \u2014 a concern without a stated reason is not a concern that\
            \ did not happen \u2014 but a reader weighing it needs to know the difference."
          title: Evidence Stated
          type: boolean
        kind:
          $ref: '#/components/schemas/ConcernKind'
          description: Which of the five things the prompt asks about, or `other`.
      required:
      - kind
      - confidence
      - evidence
      - evidence_stated
      title: WelfareConcernEntry
      type: object
    Zone:
      description: 'The space a camera watches. The recorder''s `space_type` vocabulary, exactly.


        Deliberately the recorder''s four-camera vocabulary rather than a new one: the two

        systems watch the same building, and a console that shows both must not have to

        translate. Extending it is a one-line addition here plus its entry in `_KINDS`,

        which `tests/domain/test_zone.py` requires for every member.'
      enum:
      - room
      - corridor
      - dayroom
      title: Zone
      type: string
    ZoneKind:
      description: 'The coarse privacy/behaviour split a `Zone` falls into.


        Derived from `Zone`, never stored: see this module''s docstring. `StrEnum` so it

        serialises as `"room"` / `"common_area"` with no encoder of its own.'
      enum:
      - room
      - common_area
      title: ZoneKind
      type: string
info:
  title: SentinelAI AI Engine
  version: 0.1.0
openapi: 3.1.0
paths:
  /alerts:
    delete:
      description: 'Empty the register, and write that emptiness down.


        **Throws away triage state, not evidence.** Every event behind these alerts is

        already published to the broker and is still there; what goes is the record of which

        ones a human had looked at. That is a real loss and the console asks twice before

        calling this.


        Flushed before answering, like acknowledging and resolving: a 200 that did not

        survive a restart would be the same lie in the other direction.'
      operationId: clear_alerts_alerts_delete
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: integer
                title: Response Clear Alerts Alerts Delete
                type: object
          description: How many alerts were dropped.
      summary: Clear the whole alert list
    get:
      description: "Every alert this process is holding, worst first then most recent first.\n\n**An alert\
        \ is not an event.** An event is what happened; an alert is an *episode*\nthat events accumulate\
        \ into, with an occurrence count. Measured on real footage,\nforty-five seconds of one corridor\
        \ produced eleven events \u2014 and would produce\neleven rows without this. \xA717 requires that\
        \ twenty seconds of the same person is\none alert saying it happened seventeen times.\n\n**Volatile,\
        \ and more sharply so than the event ring.** This register lives in\nengine memory and a restart\
        \ empties it. The durable record is the anomaly event\npublished to RabbitMQ; alert persistence\
        \ belongs to the Phase 1C store, which is\nnot built. The consequence worth stating plainly: **an\
        \ acknowledgement does not\nsurvive a restart.** An operator who acknowledged twenty alerts and\
        \ then saw the\nengine restart is looking at twenty unacknowledged alerts again.\n\nOrdering is\
        \ the engine's, not the client's, so that every reader agrees about what\nis at the top \u2014\
        \ \xA727's \"the critical thing must be visible immediately\" is a\nproperty of that ordering\
        \ rather than of whoever asked."
      operationId: list_alerts_alerts_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertsResponse'
          description: Successful Response
      summary: "The operator's alert list \u2014 episodes, not events (volatile)"
  /alerts/{alert_id}/acknowledge:
    post:
      description: "Move an alert to `acknowledged`.\n\nThe state that matters most on a wall of alerts,\
        \ because it is the only one that\ndistinguishes \"nobody has looked\" from \"somebody is handling\
        \ it\".\n\n**`by` is a self-declared label, not an identity.** This engine has no\nauthentication,\
        \ so an acknowledgement records what somebody typed. That is worth\nhaving and it is not an audit\
        \ trail; see `docs/operations.md`.\n\nA subsequent recurrence keeps the alert acknowledged rather\
        \ than re-raising it \u2014\na person already knows, and putting it back in front of them for\
        \ something they\nare in the middle of dealing with is how an operator learns to ignore the list."
      operationId: acknowledge_alert_alerts__alert_id__acknowledge_post
      parameters:
      - in: path
        name: alert_id
        required: true
        schema:
          format: uuid
          title: Alert Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcknowledgeRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertEntry'
          description: Successful Response
        '404':
          description: No alert with this id is held by the running engine.
        '409':
          description: "This alert is already resolved, so acknowledging it would change nothing \u2014\
            \ which usually means the operator is acting on a stale list."
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Record that a person has seen this alert
  /alerts/{alert_id}/clip:
    get:
      description: "The evidence clip, as bytes a browser can play.\n\n**This is the only route that serves\
        \ a recording**, and the alert id is the whole of\nthe authorisation. The object it reads is looked\
        \ up from the alert, never taken from\nthe request, so no caller can name an object the engine\
        \ did not itself attach to an\nalert \u2014 and `MinioClipReader` re-checks the bucket rather\
        \ than trusting that.\n\n`short=true`, the default, returns the notification-length copy\n(`SENTINEL_NOTIFY_CLIP_SECONDS`,\
        \ three by default) \u2014 the length that is watched\nrather than scrolled past when an operator\
        \ is triaging a wall of rows. It falls back\nto the full recording when no short copy was made,\
        \ because \"here is a longer answer\"\nbeats \"there is nothing here\" for somebody asking what\
        \ happened. `short=false`\nalways returns the full clip: pre-roll, the event, post-roll.\n\n`Cache-Control:\
        \ private, max-age=60` rather than `no-store`. A clip is fixed once\nwritten, so re-fetching it\
        \ on every render is waste \u2014 but it is footage of people,\nso it is never a shared-cache\
        \ entry and never long-lived."
      operationId: read_alert_clip_alerts__alert_id__clip_get
      parameters:
      - in: path
        name: alert_id
        required: true
        schema:
          format: uuid
          title: Alert Id
          type: string
      - in: query
        name: short
        required: false
        schema:
          default: true
          title: Short
          type: boolean
      responses:
        '200':
          content:
            video/mp4: {}
          description: The clip, as MP4.
        '404':
          description: "No alert with this id, or no clip to play \u2014 nothing was recorded, the clip\
            \ has passed its retention window, or this engine has no object store configured."
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Watch the recording behind one alert
  /alerts/{alert_id}/resolve:
    post:
      description: "Move an alert to `resolved`.\n\nIdempotent: two operators closing the same row is\
        \ an ordinary race, not a mistake\neither of them made.\n\nA resolved alert stops absorbing recurrences\
        \ \u2014 a person said it was finished, and\nquietly reopening it would erase that judgement.\
        \ The same situation happening again\nopens a new alert, which is the truthful reading.\n\n**Nothing\
        \ resolves itself.** There is no timeout and no auto-close anywhere in this\nsubsystem, because\
        \ an alert that expired quietly would leave no trace that nobody\never went to look."
      operationId: resolve_alert_alerts__alert_id__resolve_post
      parameters:
      - in: path
        name: alert_id
        required: true
        schema:
          format: uuid
          title: Alert Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertEntry'
          description: Successful Response
        '404':
          description: No alert with this id is held by the running engine.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Record that a person has finished with this alert
  /authorized-persons:
    get:
      description: "The enrolled roster (spec \xA723).\n\n**Carries no biometric data.** No embeddings,\
        \ no vectors, no reference images \u2014\nthose live in the encrypted store and never travel on\
        \ this API. \xA712 asks that\nbiometric information is not exposed unnecessarily, and for a roster\
        \ listing the\nnecessary amount is none. `reference_faces` is a count, because \xA710 asks for\n\
        multiple references per person and \"1\" is usually the reason somebody is not being\nrecognised\
        \ from an angle.\n\nAn engine with no camera enabling `person_authorization` answers an empty\
        \ list\nrather than an error: nobody is enrolled, which is true."
      operationId: list_people_authorized_persons_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeopleResponse'
          description: Successful Response
      summary: "Everyone enrolled \u2014 names and permissions, never biometric data"
  /authorized-persons/{person_id}:
    delete:
      description: "Remove somebody and **all** of their biometric data (spec \xA712).\n\nNot a soft delete.\
        \ A record that removed the name while leaving the vectors would\nkeep exactly the part that identifies\
        \ somebody, which is the opposite of what a\ndeletion request means.\n\nDistinct from disabling:\
        \ `PUT` with `status: disabled` revokes access while keeping\nthe record, which is what an investigation\
        \ of a past incident needs. This is what a\nperson exercising a data right needs. Conflating them\
        \ means one of those two\nobligations cannot be met."
      operationId: delete_person_authorized_persons__person_id__delete
      parameters:
      - in: path
        name: person_id
        required: true
        schema:
          format: uuid
          title: Person Id
          type: string
      responses:
        '204':
          description: Successful Response
        '404':
          description: No enrolled person with this id.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '503':
          description: No camera on this engine enables person authorization.
      summary: Delete a person and every face enrolled for them
    put:
      description: "Enrol somebody, or change what they are authorised for.\n\nCarries no faces \u2014\
        \ those are enrolled separately, against an existing person, so\nthat creating a record and handing\
        \ over biometric data are two deliberate acts\nrather than one.\n\n**`camera_ids: []` authorises\
        \ nowhere.** The opposite default would make forgetting\nto set it a silent grant everywhere,\
        \ which for an access rule is the failure worth\ndesigning against.\n\n`PUT` rather than `POST`\
        \ because the id is the caller's to choose and the operation\nis idempotent: replaying it produces\
        \ the same record rather than a second person."
      operationId: upsert_person_authorized_persons__person_id__put
      parameters:
      - in: path
        name: person_id
        required: true
        schema:
          format: uuid
          title: Person Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonEntry'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '503':
          description: No camera on this engine enables person authorization.
      summary: Create or replace an authorised person
  /authorized-persons/{person_id}/faces:
    get:
      description: "Which references exist, how old each is, and whether a photograph was kept.\n\nEnough\
        \ to draw the roster and to decide which reference to remove when somebody has\nstopped being\
        \ recognised \u2014 usually the oldest, taken under different lighting."
      operationId: list_faces_authorized_persons__person_id__faces_get
      parameters:
      - in: path
        name: person_id
        required: true
        schema:
          format: uuid
          title: Person Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacesResponse'
          description: Successful Response
        '404':
          description: No enrolled person with this id.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '503':
          description: No camera on this engine enables person authorization.
      summary: "The reference faces on one person's record \u2014 metadata, not pictures"
    post:
      description: "Turn a photograph into a stored face embedding (spec \xA79).\n\nThe flow is detect\
        \ \u2192 quality check \u2192 align \u2192 embed \u2192 encrypt \u2192 store, and **the\nphotograph\
        \ is not kept**. What persists is the embedding, sealed with AES-256-GCM.\n\xA712 asks for embeddings\
        \ over raw biometric images where possible, and here it is\nentirely possible.\n\nThe largest\
        \ face in the image is used, on the assumption that an enrolment\nphotograph is *of* somebody\
        \ rather than a crowd scene. Choosing by detector\nconfidence instead would sometimes pick a sharp\
        \ bystander over a slightly soft\nsubject.\n\n**Enrol more than one.** \xA710 asks for multiple\
        \ references per person, and a single\nface-on office photograph matches a corridor camera at\
        \ an angle poorly. The usual\nfix for somebody not being recognised is a second reference, not\
        \ a lower threshold."
      operationId: enroll_face_authorized_persons__person_id__faces_post
      parameters:
      - in: path
        name: person_id
        required: true
        schema:
          format: uuid
          title: Person Id
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_enroll_face_authorized_persons__person_id__faces_post'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonEntry'
          description: Successful Response
        '404':
          description: No enrolled person with this id.
        '422':
          description: "No usable face was found in the image. The reason is in the detail \u2014 an enrolment\
            \ that silently stored nothing is how somebody becomes unrecognisable with nobody able to\
            \ say why."
        '503':
          description: No camera on this engine enables person authorization.
      summary: Enrol one reference face from a photograph
  /authorized-persons/{person_id}/faces/{face_id}:
    delete:
      description: "Drop one reference \u2014 its embedding and its picture together.\n\nFiner-grained\
        \ than deleting the person, and the difference matters: a reference\ntaken in bad light makes\
        \ somebody *harder* to recognise, and the fix is to remove\nthat reference, not to un-enrol them\
        \ and start again."
      operationId: delete_face_authorized_persons__person_id__faces__face_id__delete
      parameters:
      - in: path
        name: person_id
        required: true
        schema:
          format: uuid
          title: Person Id
          type: string
      - in: path
        name: face_id
        required: true
        schema:
          format: uuid
          title: Face Id
          type: string
      responses:
        '204':
          description: Successful Response
        '404':
          description: No such face on that person's record.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '503':
          description: No camera on this engine enables person authorization.
      summary: Remove one reference face and its photograph
  /authorized-persons/{person_id}/faces/{face_id}/image:
    get:
      description: "The face crop stored at enrolment, decrypted for this one request.\n\n**Not the photograph\
        \ that was uploaded.** What is kept is the detector's own face\nbox with a margin, at most 320\
        \ px on its longest side \u2014 enough for a person to\nrecognise a person, and deliberately not\
        \ a copy of whatever else was in the frame\n(\xA712). See `orchestrator/face_crop.py`.\n\n`Cache-Control:\
        \ no-store`, because a browser cache is a copy of biometric data on\ndisk that nothing in this\
        \ system knows about or can delete when the person is\ndeleted."
      operationId: read_face_image_authorized_persons__person_id__faces__face_id__image_get
      parameters:
      - in: path
        name: person_id
        required: true
        schema:
          format: uuid
          title: Person Id
          type: string
      - in: path
        name: face_id
        required: true
        schema:
          format: uuid
          title: Face Id
          type: string
      responses:
        '200':
          content:
            image/jpeg: {}
          description: The stored face crop.
        '404':
          description: No such face, or no photograph was kept for it.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '503':
          description: No camera on this engine enables person authorization.
      summary: One reference photograph
  /cameras:
    get:
      operationId: list_cameras_cameras_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CamerasResponse'
          description: Successful Response
      summary: List Cameras
    post:
      description: 'Add a camera to `cameras.json` and start it immediately.


        **The point of the write surface.** Every other endpoint here edits a camera

        somebody already put in the file by hand; this is what lets a console stand one up

        without an operator opening an editor and restarting the engine.


        Adding takes a `url` where `PATCH` refuses one, and the difference is not arbitrary:

        changing a running camera''s source means tearing down its runner, its pre-roll ring

        and any clip mid-recording. A camera that does not exist yet has none of those.'
      operationId: create_camera_cameras_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CameraCreateRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraEditResponse'
          description: Successful Response
        '403':
          description: Camera writes are disabled on this engine.
        '409':
          description: A camera with this id already exists, or a capability was asked for whose model
            this process never loaded.
        '422':
          description: "The camera could not be built \u2014 the detail says why."
        '503':
          description: The engine is still starting.
      summary: "Add a camera and start watching it \u2014 no restart"
  /cameras/probe:
    post:
      description: "Open a URL once, decode one frame, and report what it found \u2014 with a picture.\n\
        \nA camera added with a wrong URL fails quietly: it appears in the list and its runner\nretries\
        \ forever behind exponential backoff, with nothing to see but a `frames_seen`\nthat never moves.\
        \ This is how an operator learns that *before* saving.\n\n`ok: false` comes back as a 200. The\
        \ caller renders the outcome either way, and a\n4xx would conflate \"this URL does not play\"\
        \ with \"your request was malformed\".\n\nBehind the same flag as the writes it precedes, because\
        \ it makes the engine fetch a\nURL the caller chose \u2014 exactly the capability that flag exists\
        \ to gate on an\nunauthenticated port."
      operationId: probe_camera_cameras_probe_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProbeRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeResponse'
          description: Successful Response
        '403':
          description: Camera writes are disabled on this engine.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Look at a stream before adding it
  /cameras/{camera_id}:
    delete:
      description: "Stop watching, then remove the record \u2014 in that order.\n\nThe opposite order\
        \ to `create_camera`, for the same underlying rule: never leave\nsomething running that the file\
        \ does not describe. Writing first and then failing to\nstop would leave a camera publishing events\
        \ under an id nothing can look up."
      operationId: delete_camera_cameras__camera_id__delete
      parameters:
      - in: path
        name: camera_id
        required: true
        schema:
          title: Camera Id
          type: string
      responses:
        '204':
          description: Successful Response
        '403':
          description: Camera writes are disabled on this engine.
        '404':
          description: No camera with this id.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Stop a camera and remove it from the file
    patch:
      description: "Change what a camera is called, which zone it is grouped into, and what its\nwelfare\
        \ concerns notify a human about.\n\n### This endpoint is not authenticated\n\n**Phase 1B ships\
        \ no authentication of any kind.** The console's login screen\nis a shell, JWT arrives in Phase\
        \ 1C, and until then anything that can open a\nTCP connection to this port can call this. Every\
        \ other endpoint is a read, so\nreaching the port has so far cost an attacker information; this\
        \ one is a\nwrite, and a persisted one. An anonymous caller can rename a camera to another\ncamera's\
        \ name and re-zone it into another wing \u2014 which is to say, make the\nconsole's account of\
        \ *where an incident happened* wrong, in a custodial\nsetting, permanently, because the change\
        \ is written to `cameras.json` and\nsurvives the restart that would otherwise undo it.\n\nThat\
        \ is why it is **off unless a deployment turns it on**\n(`SENTINEL_ENABLE_CAMERA_WRITES=true`)\
        \ and answers 403 otherwise, and why a\ndeployment that turns it on should also bind the engine\
        \ to localhost or put an\nauthenticating reverse proxy in front of it. `GET /cameras` reports\
        \ the current\nposture as `config_writable`. See `docs/operations.md`.\n\n### What can be edited,\
        \ and what cannot\n\nEditable at runtime, applied to the running camera and written to\n`cameras.json`\
        \ before this returns:\n\n* `label` \u2014 the display name. Trimmed, non-empty, at most 120 characters.\n\
        * `zone` \u2014 `room`, `corridor`, `dayroom`, or `null` to ungroup. Omitting the\n  field and\
        \ sending `null` are different instructions.\n* `notify_on` \u2014 which welfare concern kinds\
        \ notify a human, as a whole\n  replacement list. `[]` means never notify from this camera and\
        \ is a real\n  edit, not an empty one; `null` is rejected because `[]` already says it.\n* `notify_min_confidence`\
        \ \u2014 `possible` or `likely`, the lowest tier that may\n  notify. There is no `certain`: one\
        \ still frame cannot earn it.\n* `clip_preroll_seconds`, `clip_postroll_seconds`,\n  `summary_interval_seconds`\
        \ \u2014 per-camera overrides of the engine-wide clip\n  bounds and the profile's summary interval.\
        \ **Omitting one and sending\n  `null` are different instructions**, as with `zone`: omit to leave\
        \ the\n  override alone, send `null` to drop it and go back to the default. Pre-roll\n  may be\
        \ `0` (no lead-in is a real choice); the other two must be above zero.\n\nEvery one of them comes\
        \ back in the response as it was stored, so a console\nrenders what the file now says rather than\
        \ what it hoped it would say.\n\n**Not editable, and rejected with 422 rather than ignored** \u2014\
        \ the response's\n`restart_required_fields` names them:\n\n* `url` \u2014 changing the source\
        \ means tearing down the running `CameraRunner`,\n  its buffered pre-roll and any clip mid-recording,\
        \ and building a new source\n  in their place. It is a camera restart, not an edit. Separately,\
        \ an RTSP URL\n  routinely carries credentials, so an unauthenticated API neither accepts nor\n\
        \  returns it.\n* `profile` \u2014 the escalation policy, which the gate is part-way through\n\
        \  applying (cooldowns, a token bucket with state). Swapping it mid-flight has\n  no defensible\
        \ semantics.\n\nBoth are edited by changing `cameras.json` and restarting the engine.\n\n### Atomicity\n\
        \nThe edit is validated against the whole document, written to a temporary file,\n`fsync`ed, and\
        \ renamed into place. It is never half-applied: a request that\nwould produce a file the engine\
        \ could not load at its next startup is refused\noutright, and everything the file holds that\
        \ this engine has no model of \u2014\ncomment keys, other cameras, fields added later \u2014 is\
        \ preserved byte-for-byte\nin meaning. The in-memory camera is only updated *after* the file is\
        \ on disk,\nand from what the file now says, so the two cannot disagree."
      operationId: update_camera_cameras__camera_id__patch
      parameters:
      - in: path
        name: camera_id
        required: true
        schema:
          title: Camera Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CameraEditRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraEditResponse'
          description: Successful Response
        '403':
          description: Camera writes are disabled on this deployment, which is the default. Set `SENTINEL_ENABLE_CAMERA_WRITES=true`
            on the engine to enable them, having read the warning in this operation's description first.
        '404':
          description: No camera with this id is configured in the running engine.
        '409':
          description: "The edit cannot be taken as things currently stand, and **nothing was written**.\
            \ Either `cameras.json` no longer admits it \u2014 most often because the file has been changed\
            \ by hand since the engine started and no longer contains this camera \u2014 or `capabilities`\
            \ named one whose model this process did not load, which needs a restart rather than a retry."
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '500':
          description: The camera file could not be written. Nothing was changed.
      summary: "Edit a camera's label, zone and welfare notification policy \u2014 UNAUTHENTICATED, and\
        \ off by default"
  /cameras/{camera_id}/clips:
    get:
      description: "What footage exists for this camera, read from the object store as it is now.\n\n\
        **Not an index and not a history.** Retention has already removed whatever it has\nremoved, so\
        \ this is what survives \u2014 which is the honest answer for a browser, and\nis why nothing here\
        \ has a \"deleted\" state. A camera that has been recording for\nlonger than `SENTINEL_CLIP_RETENTION_DAYS`\
        \ shows the window, not the run.\n\nAn unknown camera is a 404 rather than an empty list: \"this\
        \ camera was deleted\" and\n\"this camera has recorded nothing\" are different, and a browser\
        \ that rendered them\nidentically would let somebody conclude a camera had been silent all week."
      operationId: list_camera_clips_cameras__camera_id__clips_get
      parameters:
      - in: path
        name: camera_id
        required: true
        schema:
          title: Camera Id
          type: string
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClipsResponse'
          description: Successful Response
        '404':
          description: No camera with this id.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: One camera's recorded clips, newest first
  /cameras/{camera_id}/clips/{event_id}:
    get:
      description: "The recording for one event on one camera.\n\nThe object path is built inside the\
        \ adapter from two validated components \u2014 a\ncamera this engine has, and a `UUID` \u2014\
        \ never from a caller's string, and the reader\nre-checks the bucket on top of that.\n\n`short=false`\
        \ here, unlike the alert route: somebody who has opened a footage\nbrowser and picked a clip is\
        \ investigating, and the seconds before and after are\nthe reason they came. `short=true` returns\
        \ the notification trim where one exists."
      operationId: read_camera_clip_cameras__camera_id__clips__event_id__get
      parameters:
      - in: path
        name: camera_id
        required: true
        schema:
          title: Camera Id
          type: string
      - in: path
        name: event_id
        required: true
        schema:
          format: uuid
          title: Event Id
          type: string
      - in: query
        name: short
        required: false
        schema:
          default: false
          title: Short
          type: boolean
      responses:
        '200':
          content:
            video/mp4: {}
          description: The clip, as MP4.
        '404':
          description: No such camera, or no clip for that event.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Watch one of a camera's clips
  /cameras/{camera_id}/describe:
    post:
      operationId: describe_camera_now_cameras__camera_id__describe_post
      parameters:
      - in: path
        name: camera_id
        required: true
        schema:
          title: Camera Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescribeResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Describe Camera Now
  /cameras/{camera_id}/enabled:
    put:
      description: "Switch a camera off without losing how it was set up.\n\n**The alternative to deleting\
        \ it.** A camera taken down for maintenance, a feed\nthat has gone permanently dark, a lens being\
        \ repositioned \u2014 deleting is the wrong\ntool for all three, because it throws away the zone,\
        \ the capability set, the\nnotification routing and the clip overrides somebody tuned, and getting\
        \ them back\nmeans re-entering them from memory.\n\nDisabling closes the source connection and\
        \ destroys the runner, so a stopped camera\ncosts no socket, no decode and no CPU. What it keeps\
        \ is the whole record, still\nlisted in `GET /cameras` with `enabled: false`, still editable,\
        \ one request from\nrunning again with everything as it was.\n\nIts models stay loaded. Which\
        \ model roles this process holds is fixed at startup\nfrom every configured camera including the\
        \ stopped ones, so switching one back on\ncan never fail for want of a model that was never loaded\
        \ \u2014 the cost is VRAM held\nfor a camera that is not using it, which is the right trade for\
        \ making the switch\nreliable.\n\nIdempotent in both directions."
      operationId: set_camera_enabled_cameras__camera_id__enabled_put
      parameters:
      - in: path
        name: camera_id
        required: true
        schema:
          title: Camera Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CameraEnabledRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraEditResponse'
          description: Successful Response
        '404':
          description: No camera with this id.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '503':
          description: Camera writes are disabled on this engine.
      summary: Start or stop watching a camera, without deleting it
  /cameras/{camera_id}/events:
    get:
      description: "Recent anomaly events for one camera, plus the latest scene description.\n\n**This\
        \ is a volatile, bounded, in-memory view for the operator console. It is not\nthe event store\
        \ and it is not an audit trail.** The durable record is the anomaly\nevent published to RabbitMQ\
        \ and written down by the Phase 1C consumer. What this\nendpoint reads is a per-camera ring inside\
        \ the running engine that is emptied by\nany restart and that silently discards the oldest entry\
        \ once the camera has\nproduced more than `capacity` events. The absence of an event here means\
        \ \"not in\nthe last `capacity` events of this process run\" \u2014 never \"did not happen\".\
        \ Anyone\nreconciling a custodial incident must go to the store, not here.\n\nThe ring is per\
        \ camera rather than global on purpose, so that a busy camera can\nonly evict its own history\
        \ and never a quiet camera's.\n\n`latest` is the last element of `events`, lifted out for the\
        \ live scene panel and\nread from the same snapshot, so the panel and the chart cannot disagree\
        \ about\nwhich event is newest. `latest_description_state` distinguishes the three cases a\nconsole\
        \ must not confuse: `none` (nothing assembled yet in this process),\n`available` (a real vision-model\
        \ description), and `unavailable` (the vision model\ncould not answer, and `latest.description`\
        \ is a metadata-derived stand-in rather\nthan a description of the scene).\n\nAn unknown camera\
        \ is a 404, the same mapping every other camera route uses. A\nconfigured camera that has not\
        \ escalated yet is a 200 with an empty `events` list."
      operationId: get_camera_events_cameras__camera_id__events_get
      parameters:
      - in: path
        name: camera_id
        required: true
        schema:
          title: Camera Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraEventsResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: "Recent events for one camera (volatile console cache \u2014 NOT the event store)"
  /cameras/{camera_id}/snapshot:
    get:
      description: "A picture of what this camera is seeing right now.\n\n**Not video, and not a replacement\
        \ for it.** Live video is mediamtx's job and the\nconsole plays it straight from there (`src/live/HlsPlayer.tsx`).\
        \ But only cameras\n*published to* mediamtx have a playlist, and an EarthCam page or a local file\
        \ does\nnot \u2014 before this, those cameras showed an empty panel while the engine was\ndemonstrably\
        \ decoding them.\n\nSo this is the fallback the console uses when there is no playlist: one frame,\
        \ on\nrequest, which the engine already had. `Cache-Control: no-store`, because the whole\nvalue\
        \ of the thing is that it is current."
      operationId: camera_snapshot_cameras__camera_id__snapshot_get
      parameters:
      - in: path
        name: camera_id
        required: true
        schema:
          title: Camera Id
          type: string
      responses:
        '200':
          content:
            image/jpeg: {}
          description: The latest decoded frame.
        '404':
          description: No such camera, or no frame has arrived yet.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: The most recent frame from one camera, as a JPEG
  /cameras/{camera_id}/telemetry:
    get:
      operationId: get_camera_telemetry_cameras__camera_id__telemetry_get
      parameters:
      - in: path
        name: camera_id
        required: true
        schema:
          title: Camera Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraStatus'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Camera Telemetry
  /events/stream:
    get:
      description: "Every camera's anomaly events, pushed as they happen (spec \xA76.2, bridged).\n\n\
        **The same volatile, bounded, in-memory ring `GET /cameras/{camera_id}/events`\nserves \u2014\
        \ not the event store and not an audit trail.** The durable record is the\nanomaly event published\
        \ to RabbitMQ and written down by the Phase 1C consumer.\nEverything this stream can send is held\
        \ in engine memory, is lost on restart, and\nis silently evicted once a camera has produced more\
        \ than `capacity` events.\n\n**What a reconnect can and cannot give you.** Every connection opens\
        \ with a\n`backlog` frame holding what the ring currently has, then continues live. There is\n\
        no gap between the two and no duplicate across them. But the ring is bounded, so a\nclient that\
        \ was disconnected long enough for a camera to produce more than its\nring holds **has permanently\
        \ missed those events on this endpoint** \u2014 they are in\nRabbitMQ, and this endpoint will\
        \ never show them. That is why no `id:` field is\nsent and `Last-Event-ID` is not honoured: resuming\
        \ from an offset the engine may\nno longer hold would promise a continuity it cannot keep. Reconnect,\
        \ take the new\nbacklog as the current window, and go to the store for anything older.\n\n**Duplicates\
        \ and updates.** An `event_id` may arrive more than once: an event is\nre-sent when something\
        \ about it changes, currently when its clip finishes and\n`clip_uri` appears. Merge by `event_id`,\
        \ keeping the copy with the higher\n`sequence`. Two copies with the same `sequence` are the same\
        \ copy.\n\n**Falling behind.** A client that stops reading is buffered up to a fixed bound\nand\
        \ then cut off with an `overflow` frame rather than being allowed to grow the\nengine's memory.\
        \ Reconnect; the fresh backlog is more current than the queue that\nwas dropped.\n\n**Shutdown.**\
        \ The engine closes every stream as it shuts down, so a client sees a\nclean end of response rather\
        \ than a connection that hangs until a proxy times it\nout."
      operationId: stream_events_events_stream_get
      responses:
        '200':
          content:
            text/event-stream:
              schema:
                type: string
          description: "An open `text/event-stream`. Frames: `event: backlog` once, carrying a JSON array\
            \ of RecentEventEntry (oldest first, possibly empty); then `event: anomaly`, one RecentEventEntry\
            \ each, as they are assembled; `event: overflow` if this client fell too far behind, after\
            \ which the stream ends and reconnecting is the recovery; and `: keepalive` comment lines\
            \ on an idle stream. No `id:` field is sent and `Last-Event-ID` is not honoured \u2014 see\
            \ the description."
        '503':
          description: The engine has not finished starting; retry shortly.
      summary: "Live event stream (SSE) over the same volatile ring \u2014 NOT the event store"
  /health:
    get:
      operationId: get_health_health_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: Successful Response
      summary: Get Health
  /settings:
    get:
      description: "Every setting, its effective value, and whether this deployment moved it.\n\n**Read-only.**\
        \ Almost nothing here can change without a restart \u2014 which models to\nload, how much VRAM\
        \ to budget, where the broker is \u2014 so a writable version would\nhave to either lie about\
        \ taking effect or restart the engine under whoever asked.\nThe settings that *are* live are per-camera\
        \ and editable where they belong.\n\n**Credentials are never reported by value**, only as `(set)`\
        \ or `(unset)`, which is\nthe fact an operator actually needs: \"this engine has no encryption\
        \ key\" is a\ndiagnosis and the key itself is never one. Which fields those are is decided in\
        \ one\nplace, by name rather than by inspecting the value \u2014 see `config_report`."
      operationId: get_settings_report_settings_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
          description: Successful Response
      summary: What this engine is configured to do
  /storage:
    get:
      description: "Clip storage: how much, how many, per camera, and how long any of it survives.\n\n\
        **`reachable: false` is the answer that matters.** When the object store cannot be\nlisted every\
        \ count here is zero, and zero counts drawn as an empty bucket is how an\noperator concludes their\
        \ evidence has been deleted. This never fails for an\nunreachable store; it says so instead.\n\
        \nRetention is a bucket lifecycle rule the object store applies itself, not a sweeper\nin this\
        \ process \u2014 so clips expire on schedule whether or not the engine is running."
      operationId: get_storage_storage_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageResponse'
          description: Successful Response
      summary: What the clip bucket is holding
