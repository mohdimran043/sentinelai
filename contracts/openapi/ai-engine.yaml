    CamerasResponse:
      properties:
        cameras:
          items:
            $ref: '#/components/schemas/CameraStatus'
          title: Cameras
          type: array
      required:
      - cameras
      title: CamerasResponse
      type: object
    DescribeResponse:
      properties:
        event_id:
          format: uuid
          title: Event Id
          type: string
      required:
      - event_id
      title: DescribeResponse
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    HealthResponse:
      properties:
